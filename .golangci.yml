# golangci-lint v2 config for issue 927 (lint gate: 0 findings).
# Run: golangci-lint run ./...   (make lint runs it when installed)
version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # Narrow exclusions: each is a cleanup call whose error is not actionable
      # at the call site. Write paths keep their checks via other calls.
      exclude-functions:
        # interface Closers (resp.Body, generic io handles)
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (io.WriteCloser).Close
        # file handles; accepted risk: a failed Close on a written file is not reported (decision 927-1)
        - (*os.File).Close
        # database cleanup
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        # network cleanup
        - (net.Listener).Close
        - (net.Conn).Close
        # project store/handle types whose Close only wraps a Close
        - (*ubunatic.com/harnez/internal/usagestore.Store).Close
        - (*ubunatic.com/harnez/internal/bench.Store).Close
        - (*ubunatic.com/harnez/internal/telemetry.DB).Close
        - (*ubunatic.com/harnez/internal/agymeter.Meter).Close
        # advisory file locks released on process exit
        - syscall.Flock
        # formatted terminal/log output; write errors are not actionable
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # error strings are user-visible CLI/API text; rewording would change behaviour (decision 927-2)
        - -ST1005
