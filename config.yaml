    - fresh-sprinter
    - harnez-sync
    - discovery
    - grilling
    - grill-with-docs
    - domain-modeling
    - to-spec
    - jules-audit

# how `init` reconciles its own Makefile targets (e.g. `help`) into an
# existing project Makefile — see docs/src/Make.md
make:
  phony_fix: ours   # ours|all|none — how to handle existing .PHONY lines
  phony_sentinel: "" # override the ⚙️ token; empty = auto-detect or default

# debloat is the single source of truth for `harnez apply --debloat`'s
# preset content (issue 316) — do not hardcode these lists in Go.
debloat:
  # Codex: only these feature keys belong to either debloat preset. Every
  # unlisted Codex feature, skill, MCP server, hook, and setting is untouched
  # by debloat. The target file is set by codex_hooks_target. The Codex
  # context canary measured first-turn savings of 2,470 tokens for apps and
  # 1,753 tokens for plugins on Codex CLI 0.154.0. Together they saved
  # 2,876 tokens (16.4%) in the harnez repo; see
  # scripts/canary-codex-context/results.md. Both toggles remove capabilities.
  codex_features:
    apps: false
    plugins: false
  # Antigravity target debloat definitions (issue 372).
  agy:
    minimal_deny:
      - schedule
      - generate_image
      - ask_question
    aggressive_extra_deny:
      - read_url_content
      - search_web
      - define_subagent
      - manage_subagents
  # Disable Claude Code's bundled skill catalogue under every preset. Real
  # server usage measured a 2,120-token (5.5%) input saving while preserving
  # user/project skills; add lean harnez replacements only for demonstrated
  # gaps (issue 348).
  preset_disable_bundled_skills: true
  # Verified with session-local Claude Code 2.1.310 canaries (issue 968).
  # Keep server registrations intact; deny loading them under either preset.
  preset_disable_claude_ai_connectors: true
  preset_denied_mcp_servers:
    - harnez
    - codebase-memory-mcp
  # Slash-oriented user skills stay available explicitly without consuming
  # startup context.
  preset_skill_overrides:
    commit: user-invocable-only
    docup: user-invocable-only
    issue-research: user-invocable-only
    pm: user-invocable-only
    decide: user-invocable-only
    disable: user-invocable-only
    enable: user-invocable-only
    lean-sprint-v1: user-invocable-only
    lean-sprinter: user-invocable-only
    mode: user-invocable-only
    pull: user-invocable-only
    release: user-invocable-only
    respect: user-invocable-only
    review: user-invocable-only
    roadmap: user-invocable-only
    value-scan: user-invocable-only
    sprint: user-invocable-only
    sprinter: user-invocable-only
    standup: user-invocable-only
    story: user-invocable-only
    trial: user-invocable-only
    jules: user-invocable-only
    retro: user-invocable-only
    harnez-status: user-invocable-only
    harnez-selftest: user-invocable-only
    harnez-init: user-invocable-only
    harnez-handoff: user-invocable-only
    harnez-cleanup: user-invocable-only
    gokay-sweep: user-invocable-only
    sitegen-sweep: user-invocable-only
    reverse-sprint: user-invocable-only
    epic: user-invocable-only
    gokay: user-invocable-only
    sitegen: user-invocable-only
    publish: user-invocable-only
    # Unused built-in, synced, and user skills. Keep tool-feedback-protocol.
    google-workspace: off
    xlsx: off
    pptx: off
    computer-use: off
    built-in-browser: off
    artifact-emulator: off
    deep-research: off
    mcp-builder: off
    slack-gif-creator: off
    import-memory: off
    plugin-authoring: off
    internal-comms: off
    canvas-design: off
    web-artifacts-builder: off
    chrome-browser: off
    codebase-memory: off
    codebase-memory-scout: off
    codebase-memory-auditor: off
  # These retain prose-triggering under the minimal preset and become
  # explicit-only under the deliberately stronger aggressive preset.
  aggressive_skill_overrides:
    evergreen: user-invocable-only
    lmcoder: user-invocable-only
  # verified integration-only tools; safe to deny under any preset.
  minimal_deny:
    - DesignSync
    - PushNotification
    - RemoteTrigger
  # interaction/safety-relevant tools plus verified-unused integration
  # tools; denied only under the explicit --debloat-preset aggressive
  # opt-in, never by default. SendMessage is deliberately excluded: it's
  # required to follow up with a spawned subagent/teammate, which the Agent
  # tool alone cannot do (see
  # docs/studies/2026-09-15-debloat-context-usage-measurement-and-cli-flag-comparison.md).
  # EnterWorktree/ExitWorktree: this project's own CLAUDE.md forbids
  # worktree-isolated subagents for harnez work. The Google Drive MCP
  # tools: never used; also covered by disable_claude_ai_connectors, listed
  # here too for status/revert visibility under the deny list itself.
  aggressive_extra_deny:
    - AskUserQuestion
    - ScheduleWakeup
    - ReportFindings
    - EnterPlanMode
    - ExitPlanMode
    - EnterWorktree
    - ExitWorktree
    - mcp__claude_ai_Google_Drive__authenticate
    - mcp__claude_ai_Google_Drive__complete_authentication
  # separately opt-in via their own flags, independent of preset choice.
  cron_deny:
    - CronCreate
    - CronDelete
    - CronList
  notebook_deny:
    - NotebookEdit

permissions:
  allow:
    - "mcp__harnez__*"
    # system diagnostics
    - "Bash(journalctl *)"
    - "Bash(sudo smartctl *)"
    - "Bash(lsblk *)"
    - "Bash(sudo lsblk *)"
    - "Bash(dmesg *)"
    - "Bash(vcgencmd *)"
    - "Bash(ip link *)"
    - "Bash(tune2fs -l *)"
    - "Bash(sudo tune2fs -l *)"
    - "Bash(getent *)"
    # network config (moderate risk: can set interface params)
    - "Bash(ifconfig *)"
    - "Bash(iwconfig *)"
    - "Bash(iw *)"
    # package management (read-only)
    - "Bash(dpkg *)"
    - "Bash(apt-cache *)"
    # service management
    - "Bash(systemctl *)"
    # dev tools
    - "Bash(git *)"
    - "Bash(make *)"
    - "Bash(go *)"
    # harnez shims & execution wrapper (issue 270)
    - "Bash(⚙ *)"
    - "Bash(harnez *)"
    # shell basics
    - "Bash(ls *)"
    - "Bash(cd *)"
    - "Bash(ps *)"
    - "Bash(ssh -V)"
    - "Bash(uname *)"
    - "Bash(crontab *)"
    - "Bash(tree *)"
    - "Bash(pgrep *)"
    - "Bash(findmnt *)"
    # home directory reads (safe paths; excludes .ssh, .gnupg, .aws, .config)
    - "Read(~/.claude/**)"
    - "Read(~/.bashrc)"
    - "Read(~/.zshrc)"
    - "Read(~/.userrc)"
    - "Read(~/.local/**)"
    - "Read(~/projects/**)"
    - "Read(~/git/**)"
    - "Read(~/Pictures/Screenshots/**)"
    # system directory reads
    - "Read(//etc/**)"
    - "Read(//proc/**)"
    - "Read(//sys/**)"
    - "Read(//run/**)"
    - "Read(//var/**)"
    - "Read(//usr/**)"
  deny: []

hooks:
  - event: SessionStart
    command: "harnez hook claude-instructions"
  - event: Stop
    command: "harnez hook sound"
  # telemetry (always-on) + distill autopipe (opt-in via
  # HARNEZ_DISTILL_AUTOPIPE=true, see issue 069) in ONE PreToolUse/Bash
  # hook: `harnez exec hook` composes distill's own rewrite internally
  # before wrapping the result for tool_calls recording (issue 116/118).
  # This is intentionally the ONLY PreToolUse/Bash hook apply installs —
  # Claude Code does not compose two hooks' updatedInput rewrites on the
  # same matcher (last one to finish wins, non-deterministically, per its
  # hooks-guide "Limitations" section), so `harnez distill hook` is no
  # longer separately wired in here even though the command still exists
  # standalone. See docs/HookRewritePattern.md.
  - event: PreToolUse
    matcher: Bash
    command: "harnez exec hook"
  - event: PreToolUse
    matcher: View
    command: "harnez hook read"
  - event: PreToolUse
    matcher: Read
    command: "harnez hook read"
  - event: PreToolUse
    matcher: ReadMultipleFiles
    command: "harnez hook read"
  - event: PreToolUse
    matcher: Edit
    command: "harnez hook pre-edit"
  - event: PreToolUse
    matcher: Write
    command: "harnez hook pre-edit"
  # skill telemetry (issue 735)
  - event: PostToolUse
    matcher: Skill
    command: "harnez hook skill"
  - event: PostToolUseFailure
    matcher: Skill
    command: "harnez hook skill"
  - event: UserPromptSubmit
    command: "harnez hook skill"

# thinking verbs (get rid of annoying word creations)
verbs:
  - "🤖"

env:
  DEBUG: "false"
  HARNEZ_DISTILL_AUTOPIPE: "false"

distill_autopipe:
  pi_extension_target: ~/.pi/agent/extensions/harnez-distill.ts
  opencode_plugin_target: ~/.config/opencode/plugins/harnez-distill.ts

# MVP: cwd only. Renders on its own row above Claude Code's built-in footer
# badges (esc-to-interrupt / ? for shortcuts) — it cannot share that row.
# See issues/095.
status_line: true

# Opt in to the embedded Jev session compaction plugin on global `apply`.
jev_compaction_enabled: false

commands:
  - name: standup
    description: "Summarize today's git activity"
    content: |
      Run `git log --since=midnight --oneline` and summarize what was done.

  - name: commit
    description: "Commit all pending code, including stray issues/docs changes, into a clean working tree"
    content: |
      Run `git status`. Stage and commit all pending changes, including stray
      issues/ or docs/ files that weren't part of the current task, provided
      you are either the author of that code or have done a quick sanity check
      on stray docs content. Goal: a clean working tree. This is manual-only —
      do not treat this command as a trigger for auto-commit behavior elsewhere
      in the session.

  - name: pull
    description: "git pull, resolve conflicts if needed, summarize what changed"
    content: |
      Run `git pull`. If conflicts arise, resolve them and explain the
      resolution. Summarize what was pulled using `git log` (author, count,
      one-line themes). Only inspect the full diff if the log summary is
      insufficient to explain a change.


skills_target: ~/.gemini/skills
codex_skills_target: ~/.codex/skills
codex_hooks_target: ~/.codex/config.toml
agy_hooks_target: ~/.gemini/config/hooks.json
claude_skills_target: ~/.claude/skills
prime_agent_target: ~/.prime/agent
pi_agent_target: ~/.pi/agent
agy_target: ~/.gemini/antigravity-cli

# Third-party skills that ship inside harnez (issue 631 step A). Source of
# truth for which skills are bundled. `harnez skill vendor` copies them from
# url at commit into dir (with LICENSE); rebuild to embed them; `harnez apply`
# installs them explicit-only (Claude: /name only; Codex: implicit off;
# Gemini/Prime: no copy). Never edit the vendored copies; to update, raise
# commit and re-run vendor. Names must not clash with `skills:` below.
bundled_skills: []

skills:
  - name: issue-research
    license: AGPL-3.0-or-later
    description: "Fan out subagent web research over candidate tickets, report, and update tracker. Only on explicit /issue-research."
    file: docs/commands/issue-research.md

  - name: focus
    license: AGPL-3.0-or-later
    description: "Re-ground on the host repository's product, summarize its top 2-3 open priorities with expected outcomes, and ask for the next goal. Use at the start of a session or when the user asks what to work on."
    file: docs/commands/focus.md

  - name: pm
    license: AGPL-3.0-or-later
    description: "Put this session in product-manager mode: ground on the product with focus, route each request to issue, factory-sprint or lean-sprint, and stay a non-coding host. Only on explicit /pm, /pm lean or /pm factory."
    file: docs/commands/pm.md

  - name: decide
    license: AGPL-3.0-or-later
    description: "Session-scoped autonomy for the orchestrating agent: answer simple questions yourself, consult cheap or smart advisors, push ready work without asking, and stop only for very critical questions. Only on explicit /decide."
    file: docs/commands/decide.md

  - name: disable
    license: AGPL-3.0-or-later
    description: "Owner suspends one rule, skill trigger or process step (Quota-1, sprint auto-selection, push to main) for the current session; prose input. Only on explicit /disable typed by the user."
    file: docs/commands/disable.md

  - name: enable
    license: AGPL-3.0-or-later
    description: "Owner restores a rule suspended with /disable; prose input. Only on explicit /enable typed by the user."
    file: docs/commands/enable.md

  - name: docup
    license: AGPL-3.0-or-later
    description: "Review and update bounded repository documentation by category (testing, architecture, CLI, configuration)"
