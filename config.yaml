target_dir: ~/.claude

docs:
  - golang
  - bash
  - make
  - rust
  - zig
  - cpp
  - markdown
  - git
  - gtk4
  - canary
  - spec
  - agentic-loop
  - issue-tracking

# model: sonnet  # unmanaged by default, let user or client choose
effort: medium

# how `init` reconciles its own Makefile targets (e.g. `help`) into an
# existing project Makefile — see docs/src/Make.md
make:
  phony_fix: ours   # ours|all|none — how to handle existing .PHONY lines
  phony_sentinel: "" # override the ⚙️ token; empty = auto-detect or default

permissions:
  allow:
    # system diagnostics
    - "Bash(journalctl *)"
    - "Bash(sudo smartctl *)"
    - "Bash(lsblk *)"
    - "Bash(sudo lsblk *)"
    - "Bash(dmesg *)"
    - "Bash(vcgencmd *)"
    - "Bash(ip link *)"
    - "Bash(tune2fs -l *)"
    - "Bash(sudo tune2fs -l *)"
    - "Bash(getent *)"
    # network config (moderate risk: can set interface params)
    - "Bash(ifconfig *)"
    - "Bash(iwconfig *)"
    - "Bash(iw *)"
    # package management (read-only)
    - "Bash(dpkg *)"
    - "Bash(apt-cache *)"
    # service management
    - "Bash(systemctl *)"
    # dev tools
    - "Bash(git *)"
    - "Bash(make *)"
    - "Bash(go *)"
    # shell basics
    - "Bash(ls *)"
    - "Bash(cd *)"
    - "Bash(ps *)"
    - "Bash(ssh -V)"
    - "Bash(uname *)"
    - "Bash(crontab *)"
    - "Bash(tree *)"
    - "Bash(pgrep *)"
    - "Bash(findmnt *)"
    # home directory reads (safe paths; excludes .ssh, .gnupg, .aws, .config)
    - "Read(~/.claude/**)"
    - "Read(~/.bashrc)"
    - "Read(~/.zshrc)"
    - "Read(~/.userrc)"
    - "Read(~/.local/**)"
    - "Read(~/projects/**)"
    - "Read(~/git/**)"
    - "Read(~/Pictures/Screenshots/**)"
    # system directory reads
    - "Read(//etc/**)"
    - "Read(//proc/**)"
    - "Read(//sys/**)"
    - "Read(//run/**)"
    - "Read(//var/**)"
    - "Read(//usr/**)"
  deny: []

hooks:
  - event: Stop
    command: "ffplay -nodisp -autoexit /usr/share/sounds/freedesktop/stereo/window-attention.oga 2>/dev/null || true"

# thinking verbs (get rid of annoying word creations)
verbs:
  - "🤖"

env:
  DEBUG: "false"

mcp_servers: []

commands:
  - name: review
    description: "Review current branch against main"
    content: |
      Review the diff vs main. Check for: correctness, security, tests, docs.

  - name: standup
    description: "Summarize today's git activity"
    content: |
      Run `git log --since=midnight --oneline` and summarize what was done.

  - name: evergreen
    description: "Create/update evergreen docs and issue files for the current session"
    file: commands/evergreen.md

  - name: story
    description: "Write a candid engineering retrospective and case study in docs/studies/"
    file: commands/story.md

  - name: domain-modeling
    description: "Actively build and sharpen the project's domain model, glossary, and ADRs"
    file: commands/domain-modeling.md

  - name: grilling
    description: "Interview relentlessly about a plan or design until every branch is resolved"
    file: commands/grilling.md

  - name: grill-with-docs
    description: "Grilling session that also sharpens the domain model and updates CONTEXT.md/ADRs inline"
    file: commands/grill-with-docs.md

  - name: make-spec
    description: "Turn the current conversation into a spec and publish it to issues/"
    file: commands/make-spec.md

  - name: sync-mattpocock-skills
    description: "Diff our adapted mattpocock/skills commands against upstream and report drift"
    file: commands/sync-mattpocock-skills.md

  - name: sprint
    description: "Orchestrate a 5-phase agentic sprint loop (Advisors -> Dev -> Review -> Hygiene -> Retro)"
    file: commands/sprint.md

skills_target: ~/.gemini/skills
codex_skills_target: ~/.codex/skills
prime_agent_target: ~/.prime/agent

skills:
  - name: evergreen
    description: "Create/update evergreen docs and issue files for the current session"
    file: commands/evergreen.md

  - name: story
    description: "Write a candid engineering retrospective and case study in docs/studies/"
    file: commands/story.md

  - name: domain-modeling
    description: "Actively build and sharpen the project's domain model, glossary, and ADRs"
    file: commands/domain-modeling.md

  - name: sprint
    description: "Orchestrate a 5-phase agentic sprint loop (Advisors -> Dev -> Review -> Hygiene -> Retro)"
    file: commands/sprint.md

agents_md:
  # config for local md file
  global:
    target: ~/.claude/CLAUDE.md
    symlink: ~/AGENTS.md
    sections:
      - name: Instructions Hierarchy
        content: |
          - This is the global agent instructions file.
          - Every project must have a local AGENTS.md that defines its rules.
            Claude Code also discovers it through a local CLAUDE.md symlink.
            If the local instructions file is missing, report this to the user.
          - If local AGENTS.md does not define language rules, report it to the user.
          - Local rules may refer to global docs managed by harnez.
            Resolve local @docs or @rules refs to ./docs or ./rules first,
            then to the active harness directory (~/.claude or ~/.prime/agent).
          - Context Discipline: do not execute whole-file reads on AGENTS.md or active system prompt files; use grep or range-bounded reads.
          - Voice Input: the user may use speech-to-text (ASR); interpret phonetic homophones and transcription anomalies with context awareness.
          - Always use absolute file paths for global instructions.
            Always use relative file paths for local instructions.
      - name: Minimal Global Docs
        content: |
          Make sure that the global CLAUDE.md does not contain anyting not relevant
          for the project. It must apply to all projects and be used as glue between
          local and global docs only.
          The purpose of the global doc is to steer the agentic setup.

  # config for local md file
  local:
    target: AGENTS.md
    symlink: CLAUDE.md
    # Language Conventions section is generated dynamically from -l flags

  # available language docs — always installed to ~/.claude/docs/ on apply
  # use --docs <name>,<name> to copy into a project and update its AGENTS.md
  # default: true=always copy on init, false=only if explicitly requested, auto=detect from project
  languages:
    golang:
      name: "Go/Golang"
      ref: "@docs/Go.md"
      hint: "Modern Go, avoid deps but use Cobra, add tests"
      source: docs/lang/Go.md
      target: ~/.claude/docs/Go.md
      local: ./docs/Go.md
      default: auto   # go.mod
    bash:
      name: "Bash/Shell"
      ref: "@docs/Bash.md"
      hint: |
        Read before multi-line shell: Make recipes, embedded scripts
        No ";", break before then/else/docs
        No "if [[]]", No "if []", Use "if test"
        smart indent!
      source: docs/lang/Bash.md
      target: ~/.claude/docs/Bash.md
      local: ./docs/Bash.md
      default: auto   # *.sh files
    make:
      name: "Make/Makefile"
      ref: "@docs/Make.md"
      hint: "⚙️ phony sentinel, self-doc help, build dependency pattern"
      source: docs/lang/Make.md
      target: ~/.claude/docs/Make.md
      local: ./docs/Make.md
      template: docs/templates/Makefile
      targets: docs/templates/MakeTargets.mk
      default: auto   # Makefile
    rust:
      name: "Rust"
      ref: "@docs/Rust.md"
      hint: "cargo fmt + clippy; safe Rust; avoid .unwrap() in library code"
      source: docs/lang/Rust.md
      target: ~/.claude/docs/Rust.md
      local: ./docs/Rust.md
      default: auto   # Cargo.toml
    zig:
      name: "Zig"
      ref: "@docs/Zig.md"
      hint: "Explicit allocation, ReleaseSmall for CLI/utilities, Zig 0.16.0 conventions"
      source: docs/lang/Zig.md
      target: ~/.claude/docs/Zig.md
      local: ./docs/Zig.md
      default: auto   # build.zig, build.zig.zon, *.zig
    cpp:
      name: "C/C++"
      ref: "@docs/Cpp.md"
      hint: "Use ccache for CGO builds, prefer modern C++17"
      source: docs/lang/Cpp.md
      target: ~/.claude/docs/Cpp.md
      local: ./docs/Cpp.md
      default: auto   # *.c, *.cpp, *.cc, *.h, *.hpp, CMakeLists.txt
    markdown:
      name: "Markdown"
      ref: "@docs/Markdown.md"
      hint: "PascalCase for evergreens, kebab-case for ephemeral docs"
      source: docs/lang/Markdown.md
      target: ~/.claude/docs/Markdown.md
      local: ./docs/Markdown.md
      default: true   # every project has markdown
    git:
      name: "Git"
      ref: "@docs/Git.md"
      hint: "conventional commits, work on the default branch, don't push unless asked"
      source: docs/lang/Git.md
      target: ~/.claude/docs/Git.md
      local: ./docs/Git.md
      default: true   # every project uses git
    gtk4:
      name: "GTK4/PyGObject"
      ref: "@docs/GTK4.md"
      hint: "GTK4 + PyGObject; prefer GObject signals over polling"
      source: docs/lang/GTK4.md
      target: ~/.claude/docs/GTK4.md
      local: ./docs/GTK4.md
      default: false
    canary:
      name: "Canary-first development"
      ref: "@docs/Canary.md"
      hint: "probe external mechanisms before building features on them"
      source: docs/other/Canary.md
      target: ~/.claude/docs/Canary.md
      local: ./docs/Canary.md
      default: true
    spec:
      name: "Spec system"
      ref: "@docs/Spec.md"
      hint: "YAML spec files as single source of truth; Go code must not duplicate spec values"
      source: docs/other/Spec.md
      target: ~/.claude/docs/Spec.md
      local: ./docs/Spec.md
      default: true
    agentic-loop:
      name: "Agentic Loop Practices"
      ref: "@docs/AgenticLoop.md"
      hint: "5-phase loop (Advisory -> Dev -> Review -> Hygiene -> Retro), zero zombie guarantee"
      source: docs/practices/AgenticLoop.md
      target: ~/.claude/docs/AgenticLoop.md
      local: ./docs/AgenticLoop.md
      default: true
    issue-tracking:
      name: "Issue Tracking Practices"
      ref: "@docs/IssueTracking.md"
      hint: "P0-P3 priorities, metadata headers (Status, Priority, Severity, Category), tracker sync"
      source: docs/practices/IssueTracking.md
      target: ~/.claude/docs/IssueTracking.md
      local: ./docs/IssueTracking.md
      default: true

  # repo git setups — pick one with `init --repo-mode/-m` to add a short
  # "Repo Setup" section to a project's AGENTS.md (see docs/lang/Git.md for the
  # general rules these builds on)
  repo_modes:
    solo:
      name: "Solo / hobby"
      content: |
        ## Repo Setup
        - Solo/hobby repo — single default branch, no PR workflow.
        - codeberg.org is primary; github.com (if present) is a synced mirror only.
    fork:
      name: "Fork"
      content: |
        ## Repo Setup
        - This repo is a fork.
        - Keep the default branch in sync with upstream; never force-push over upstream history.
        - Open PRs against upstream from feature branches, not from the default branch.
        - codeberg.org is primary; github.com may carry contributor branches for upstream PRs.
    team:
      name: "Team / protected branches"
      content: |
        ## Repo Setup
        - Team repo with protected branches.
        - Never push directly to the default branch — open a PR and get it reviewed.
        - Update/rebase your branch before merging; follow this repo's CI and review requirements.
