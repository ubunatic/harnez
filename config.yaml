        target: references/DocupTesting.md
      - source: docs/commands/DocupArch.md
        target: references/DocupArch.md
      - source: docs/commands/DocupCli.md
        target: references/DocupCli.md
      - source: docs/commands/DocupConfig.md
        target: references/DocupConfig.md

  - name: harnez-advisor
    license: AGPL-3.0-or-later
    description: "Continue a specific earlier advisor session, only when the user explicitly requests session reuse or resumption"
