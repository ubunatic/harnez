    file: commands/website.md

  - name: harnez-sync
    description: "Autonomously sweep sibling agent projects for managed-docs drift and reconcile it (scan -> triage -> stop-marker protect -> init -> verify)"
    file: commands/harnez-sync.md

  - name: roadmap
    description: "Product-manager-style roadmap creation/update from the open issue backlog (check issues -> check existing roadmap -> synthesize/reconcile by product value axis)"
    file: commands/roadmap.md

  - name: discovery
    description: "Product discovery gap analysis: compare a repo's stated use cases against its real implemented surface and the open+closed issue tracker to surface untracked capability gaps as candidates (never files tickets itself)"
    file: commands/discovery.md

  - name: publish
    description: "Multi-project release & publish pipeline: detects project shape (CLI, artifact app, website, hybrid), executes pre-flight checks, verifies media, requires explicit confirmation before external push, syncs website, and asserts live endpoint liveness"
    file: commands/publish.md

  - name: lmcoder
    description: "Local LLM server lifecycle management, fast interactive prompt streaming with session continuity, and sandboxed coding agent execution"
    file: commands/lmcoder.md

  - name: release
    description: "Lean CLI release: commit pending code, push, run harnez release, fix issues or ask on login"
    file: commands/release.md


  - name: tool-feedback-protocol
    description: "Use after an internal tool call (Read, Edit, Bash, etc.) in a harnez-tracked project (issues/ present) failed or didn't produce the expected outcome — record it via harnez rate before moving to the next step. Also use if a harnez tip nudges you after a long quiet stretch and nothing has failed — confirm with harnez rate --ok. Skip both for routine successful calls."
    rate_feedback: true
    content: |
      # Tool Feedback Protocol

      This project is harnez-tracked (`issues/` present). Rate a tool call — Read, Edit,
      Bash, Grep, whatever just ran — only when:

      - it failed (non-zero exit, error result, exception), or
      - it succeeded but didn't produce the expected outcome (a fix that didn't fix, a
        search that missed the target, a build that passed but the feature still didn't
        work).

      Routine successful calls (a Read that returned the right file, a Grep that found the
      match) don't need a rating — this is the signal-carrying subset, not every call.

      ```
      harnez rate <tool_name> <1-5> "<1-line outcome summary>" "<project_folder>/<ticket_name>"
      ```

      Example:
      ```
      harnez rate Grep 1 "search missed the target function, wrong file" harnez/117-harnez-rate-command
      ```

      Score 5 = flawless, 3 = partial success / required adjustment, 1 = total failure /
      useless output.

      Silence is otherwise ambiguous — it could mean "all fine" or "forgot the protocol." If
      a harnez tip nudges you after a long quiet stretch and nothing has failed, confirm with
      a lean heartbeat instead of staying silent or inventing a fake per-tool score:

      ```
      harnez rate --ok
      ```

      No tool name, score, or ticket required; it records a distinct, lightweight
      confirmation, kept out of failure-rate metrics. Don't call it proactively on a fixed
      schedule — only in response to the tip, so this stays rare.

      Some commands are *expected* to fail — probing whether a server is down,
      deliberately reproducing a bug, a negative-case test. Don't launder a real failure
      into "expected" after the fact; declare the intent on the command itself, at call
      time (issue 226):

      - Cheapest, for any shell command: make the *wrapping* call's own exit code 0, e.g.
        `curl -sf http://maybe-down-host/health || echo "expected failure: exit=$?"`.
        `harnez exec` (the invisible `Bash` PreToolUse rewrite) records the wrapping
        command's exit code, so it never enters `FailureCount`/`UnratedFailureCount` to
        begin with — nothing else to do, and no `harnez rate` call needed either.
      - If you need the command's real exit code preserved and returned (e.g. your own
        `$?`-dependent logic downstream needs it), prefix instead:
        `HARNEZ_EXPECT_FAILURE=1 curl -sf http://maybe-down-host/health`. `harnez exec`
        detects the marker and records the row's call_type as an expected failure — the
        true exit code is still returned to you and stored in telemetry, only the
        failure-signal classification changes.

      Why this, and why now (not at session end): the score is a judgment only the acting
      agent can make in the moment — a mechanized PostToolUse hook can log that a call
      happened, but not whether it helped. Rating right after the call, while the outcome is
      still fresh, is what makes the signal trustworthy; batching ratings from memory at the
      end of a session produces noise. This is the same "exercised as a literal template every
      time" mechanism that makes the git-commit-trailer convention reliably followed — a
      standing policy statement without a concrete trigger and worked example gets skipped.

      If this project has no `issues/` tracker, this protocol doesn't apply — skip it rather
      than inventing a ticket path.

agents_md:
  # config for local md file
  global:
    target: ~/.claude/CLAUDE.md
    symlink: ~/AGENTS.md
    sections:
      - name: Instructions Hierarchy
        content: |
          - This is the global agent instructions file.
          - Every project must have a local AGENTS.md that defines its rules.
            Claude Code also discovers it through a local CLAUDE.md symlink.
            If the local instructions file is missing, report this to the user.
          - If local AGENTS.md does not define language rules, report it to the user.
          - Local rules may refer to global docs managed by harnez.
            Resolve local @docs or @rules refs to ./docs or ./rules first,
            then to the active harness directory (~/.claude or ~/.prime/agent).
          - Context Discipline: avoid whole-file reads on active system-prompt files (AGENTS.md,
            CLAUDE.md); use grep or range-bounded reads — see @docs/AgenticLoop.md Invariant 6.
          - Editing Discipline & Issue Tracker Discovery: for a harnez-tracked project
            (`issues/` present), see that project's AGENTS.md "Harnez Managed Conventions"
            block for `apply_patch`-preferred editing and `harnez find`/`harnez issues` usage.
          - Voice Input: the user may use speech-to-text (ASR); interpret phonetic homophones and transcription anomalies with context awareness.
          - Always use absolute file paths for global instructions.
            Always use relative file paths for local instructions.
          - Minimal Global Docs: keep this global file free of anything not relevant to every
            project — it applies everywhere and is glue between local and global docs only,
            steering the agentic setup rather than carrying project-specific content.
          - Working-Directory Hygiene: prefer `make -C`/`git -C`/absolute paths or a subshell
            `(cd dir && cmd)` over bare `cd`; if you must `cd`, return to the starting directory
            before the tool call ends — the shell may be shared with the user's own terminal.
            See @docs/Bash.md §8.
      - name: Tool Feedback Protocol
        rate_feedback: true
        content: |
          ### Tool Feedback Protocol
          Harnez-tracked projects only (`issues/` present); omit ticket or skip otherwise.
          Rate a call only when it failed or produced an unexpected outcome — not routine successes:
          `harnez rate <tool_name> <1-5> "<1-line outcome summary>" "<project_folder>/<ticket_name>"`
          Example: `harnez rate Grep 1 "missed target, wrong file" harnez/117-harnez-rate-command`
          Score 5 flawless, 3 partial, 1 useless.
          If prompted after a long quiet stretch and nothing has failed, confirm with
          `harnez rate --ok` instead of staying silent — no tool name, score, or ticket required.
      - name: Agent-Filed Feedback
        content: |
          ### Agent-Filed Feedback (harnez feedback)
          Harnez-tracked projects only. When you observe a genuine harnez bug or a
          broken/contradictory instruction — not routine friction, uncertainty, or
          anything you could resolve by asking — record it:
          `harnez feedback issue "<description>" [--severity bug|instruction]`
          Do not call this for routine friction; see `harnez feedback list` to review past entries.

  # config for local md file
  local:
    target: AGENTS.md
    symlink: CLAUDE.md
    template: docs/templates/AGENTS.md
    # Language Conventions section is generated dynamically from -l flags
    sections:
      - name: Harnez Managed Conventions
        content: |
          ## Harnez Managed Conventions

          Managed by harnez — local edits here are overwritten on the next `harnez init`.
          Put project-specific rules outside this block.

          ### Editing Discipline
          - Prefer structured patch tools (`apply_patch`) or whole-block replacements over
            narrow string substitution edits.
          - When making multi-line edits, ensure sufficient surrounding context lines to
            avoid ambiguous pattern matches.

          ### Issue Tracker Discovery (harnez find)
          Applies when this project has an `issues/` tracker. To search existing issues,
          compute the next ticket number, or allocate one, use `harnez find` / `harnez issues`
          instead of `ls issues/`, `find`, or raw grep:
          - `harnez find -d <repo> issues -a status:open` — list active open issues
          - `harnez find -d <repo> issues "<query>"` — fuzzy search across titles and body text
          - `harnez find -d <repo> issues next` — report the next free ticket number (read-only)
          - `harnez issues new -d <repo> "<title>"` — atomically reserve that number and create
            a placeholder ticket file; write the ticket to the printed path
          - `harnez issues <verb> -d <repo> <n> [reason]` — change a ticket's status, resync
            `issues/README.md`, and commit, in one call
          - `harnez index -d <repo>` — update `issues/README.md` after filing or updating tickets
          - Commit documentation and `issues/*.md` changes immediately; don't batch them behind
            pending code work.

          ### Agentic Loop Invariants
          Where `@docs/AgenticLoop.md` is present in this project, follow it rather than
          restating it here — in particular Invariant 1 (Parallel Read, Sequential Write:
          one writer per workspace), Invariant 3 (Zero Zombie Guarantee: track and terminate
          every background task and subagent), Invariant 6 (Context Discipline: no whole-file
          reads of AGENTS.md/CLAUDE.md — grep or range-bounded reads), and Invariant 7
          (Media & Demo Verification Gate: explicit user confirmation before publishing
          recordings or screenshots).

  # agent-specific instruction profiles (issue 149): each key is an agent id
  # with its own owned target file, scoped to exactly that agent. Nothing
  # here reaches ~/.claude/CLAUDE.md, AGENTS.md, or ~/.prime/agent/AGENTS.md.
  # Rule: shared behavior goes in `global`; a correction that would be inert
  # or wrong for another agent goes here under `agents.<id>`.
  agents:
    codex:
      target: ~/.codex/AGENTS.md
      sections:
        - name: Background Job Waiting
          content: |
            ### Background Job Waiting
            Codex has no host-notified subagent/background-job completion callback like
            Claude Code's. `codex agents` only lets you browse agent sessions on the shared
            local app-server daemon, and `codex queue` only queues a message into an existing
            session — neither is an event-driven completion notification. Verified against
            codex-cli 0.153.4: no such primitive exists yet.
            Do not spin a tight polling loop waiting on a background task or subagent. If you
            must wait on one, use a bounded/backoff poll (increasing delay between checks, with
            a maximum number of attempts or a maximum wait time) against `codex agents` rather
            than a fixed tight loop, and prefer surfacing the wait to the user instead of
            blocking silently.

  # available language docs — always installed to ~/.claude/docs/ on apply
  # use --docs <name>,<name> to copy into a project and update its AGENTS.md
  # default: true=always copy on init, false=only if explicitly requested, auto=detect from project
  languages:
    golang:
      name: "Go/Golang"
      ref: "@docs/Go.md"
      hint: "Modern Go, avoid deps but use Cobra, add tests; use runes and display width for terminal layout"
      source: docs/lang/Go.md
      target: ~/.claude/docs/Go.md
      local: ./docs/Go.md
      default: auto   # go.mod
    manpages:
      name: "Man Pages for Go CLIs"
      ref: "@docs/ManPages.md"
      hint: "cobra/doc GenManTree; <cmd> man / man --install; XDG ~/.local/share/man/man1"
      source: docs/lang/ManPages.md
      target: ~/.claude/docs/ManPages.md
      local: ./docs/ManPages.md
      default: auto   # go.mod + cobra dep
    bash:
      name: "Bash/Shell"
      ref: "@docs/Bash.md"
      hint: |
        Read before multi-line shell: Make recipes, embedded scripts
        No ";", break before then/else/docs
        No "if [[]]", No "if []", Use "if test"
        smart indent!
        Use git -C/make -C, not cd
      source: docs/lang/Bash.md
      lite_source: docs/lang/Bash.lite.md
      target: ~/.claude/docs/Bash.md
      local: ./docs/Bash.md
      default: auto   # *.sh files
    make:
      name: "Make/Makefile"
      ref: "@docs/Make.md"
      hint: "⚙️ phony sentinel, self-doc help, build dependency pattern"
      source: docs/lang/Make.md
      lite_source: docs/lang/Make.lite.md
      target: ~/.claude/docs/Make.md
      local: ./docs/Make.md
      template: docs/templates/Makefile
      targets: docs/templates/MakeTargets.mk
      default: auto   # Makefile
    rust:
      name: "Rust"
      ref: "@docs/Rust.md"
      hint: "cargo fmt + clippy; safe Rust; avoid .unwrap() in library code"
      source: docs/lang/Rust.md
      target: ~/.claude/docs/Rust.md
      local: ./docs/Rust.md
      default: auto   # Cargo.toml
    zig:
      name: "Zig"
      ref: "@docs/Zig.md"
      hint: "Explicit allocation, ReleaseSmall for CLI/utilities, Zig 0.16.0 conventions"
      source: docs/lang/Zig.md
      target: ~/.claude/docs/Zig.md
      local: ./docs/Zig.md
      default: auto   # build.zig, build.zig.zon, *.zig
    cpp:
      name: "C/C++"
      ref: "@docs/Cpp.md"
      hint: "Use ccache for CGO builds, prefer modern C++17"
      source: docs/lang/Cpp.md
      target: ~/.claude/docs/Cpp.md
      local: ./docs/Cpp.md
      default: auto   # *.c, *.cpp, *.cc, *.h, *.hpp, CMakeLists.txt
    markdown:
      name: "Markdown"
      ref: "@docs/Markdown.md"
      hint: "PascalCase for evergreens, kebab-case for ephemeral docs; ASCII art in chat, Mermaid only in docs/"
      source: docs/lang/Markdown.md
      target: ~/.claude/docs/Markdown.md
      local: ./docs/Markdown.md
      default: true   # every project has markdown
    git:
      name: "Git"
      ref: "@docs/Git.md"
      hint: "conventional commits, work on the default branch, don't push unless asked"
      source: docs/lang/Git.md
      target: ~/.claude/docs/Git.md
      local: ./docs/Git.md
      default: true   # every project uses git
    gtk4:
      name: "GTK4/PyGObject"
      ref: "@docs/GTK4.md"
      hint: "GTK4 + PyGObject; prefer GObject signals over polling"
      source: docs/lang/GTK4.md
      target: ~/.claude/docs/GTK4.md
      local: ./docs/GTK4.md
      default: false
    canary:
      name: "Canary-first development"
      ref: "@docs/Canary.md"
      hint: "probe external mechanisms before building features on them"
      source: docs/other/Canary.md
      target: ~/.claude/docs/Canary.md
      local: ./docs/Canary.md
      default: true
    spec:
      name: "Spec system"
      ref: "@docs/Spec.md"
      hint: "YAML spec files as single source of truth; Go code must not duplicate spec values"
      source: docs/other/Spec.md
      target: ~/.claude/docs/Spec.md
      local: ./docs/Spec.md
      default: true
    containerfile:
      name: "Containerfile build efficiency"
      ref: "@docs/Containerfile.md"
      hint: "order layers static-first/dynamic-last; git+git-lfs mandatory in agent-facing images"
      source: docs/other/Containerfile.md
      target: ~/.claude/docs/Containerfile.md
      local: ./docs/Containerfile.md
      default: false
    agentic-loop:
      name: "Agentic Loop Practices"
      ref: "@docs/AgenticLoop.md"
      hint: "5-phase loop (Advisory -> Dev -> Review -> Hygiene -> Retro), zero zombie guarantee"
      source: docs/practices/AgenticLoop.md
      lite_source: docs/practices/AgenticLoop.lite.md
      target: ~/.claude/docs/AgenticLoop.md
      local: ./docs/AgenticLoop.md
      default: true
      depends_on: [issue-tracking]

    prototyping-features:
      name: "Feature prototyping"
      ref: "@docs/PrototypingFeatures.md"
      hint: "canary-first is the feature-prototyping practice; separate runtime isolation and rollout flags"
      source: docs/practices/PrototypingFeatures.md
      target: ~/.claude/docs/PrototypingFeatures.md
      local: ./docs/PrototypingFeatures.md
      default: false
      depends_on: [canary]
    issue-tracking:
      name: "Issue Tracking Practices"
      ref: "@docs/IssueTracking.md"
      hint: "P0-P3 priorities, metadata headers (Status, Priority, Severity, Category), tracker sync"
      source: docs/practices/IssueTracking.md
      lite_source: docs/practices/IssueTracking.lite.md
      target: ~/.claude/docs/IssueTracking.md
      local: ./docs/IssueTracking.md
      default: true
    concise-mode:
      name: "ConciseMode Practices"
      ref: "@docs/ConciseMode.md"
      hint: |
        3 graded terseness tiers (Lite, Standard, Ultra); code/diffs/commands always verbatim
      source: docs/practices/ConciseMode.md
      target: ~/.claude/docs/ConciseMode.md
      local: ./docs/ConciseMode.md
      default: false
    website:
      name: "Website Building Rules"
      ref: "@docs/Website.md"
      hint: |
        no GitHub assumptions/octocats, match sibling website/ dirs or ask, honest/proven claims only,
        Why section required, relative links (subpage-hosted), static/no-CDN, opt-in JS demos only
      source: docs/other/Website.md
      target: ~/.claude/docs/Website.md
      local: ./docs/Website.md
      # Was default:true; issue 130 item 8 converted this to a real Claude
      # Code Agent Skill (see the `website` skills: entry + claude_skills_target,
      # item 7) that loads on relevance instead of being baked into every
      # project's baseline AGENTS.md. Still copyable via `init --docs website`
      # for anyone who wants the doc project-local, and via `--docs website`
      # for Prime Agent's install-everything path.
      default: false
    deployment-transparency:
      name: "Deployment Transparency Practices"
      ref: "@docs/DeploymentTransparency.md"
      hint: "3-state grounding rule (Local / Deployed Artifact / Active Daemon state) for remote deployment pairing"
      source: docs/practices/DeploymentTransparency.md
      target: ~/.claude/docs/DeploymentTransparency.md
      local: ./docs/DeploymentTransparency.md
      default: false
      capabilities: [remote-deployment]
    gorelease:
      name: "Release Pipeline"
      ref: "@docs/GoRelease.md"
      hint: "harnez release, version.yaml spec, GoReleaser v2, non-interactive minisign (-W), Forgejo has_releases, language-agnostic (Go/Python/Zig/Rust/scripted)"
      source: docs/practices/GoRelease.md
      lite_source: docs/practices/GoRelease.lite.md
      target: ~/.claude/docs/GoRelease.md
      local: ./docs/GoRelease.md
      template: docs/templates/version.yaml
      default: auto   # go.mod (opt-in / auto for Go projects)

  # repo git setups — pick one with `init --repo-mode/-m` to add a short
  # "Repo Setup" section to a project's AGENTS.md (see docs/lang/Git.md for the
  # general rules these builds on)
  repo_modes:
    solo:
      name: "Solo / hobby"
      content: |
        ## Repo Setup
        - Solo/hobby repo — single default branch, no PR workflow.
        - codeberg.org is primary; github.com (if present) is a synced mirror only.
    fork:
      name: "Fork"
      content: |
        ## Repo Setup
        - This repo is a fork.
        - Keep the default branch in sync with upstream; never force-push over upstream history.
        - Open PRs against upstream from feature branches, not from the default branch.
        - codeberg.org is primary; github.com may carry contributor branches for upstream PRs.
    team:
      name: "Team / protected branches"
      content: |
        ## Repo Setup
        - Team repo with protected branches.
        - Never push directly to the default branch — open a PR and get it reviewed.
        - Update/rebase your branch before merging; follow this repo's CI and review requirements.
