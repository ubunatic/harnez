  # AGENTS.md (see docs/lang/Git.md for the general rules these builds on).
  # `<mode>_protected` is used instead of `<mode>` when git.protected_main is
  # set. `rule` is the one-line summary written to .harnez/rules/Index.md when
  # the mode comes from repo.yaml.
  repo_modes:
    solo:
      name: "Solo / hobby"
      rule: "Git workflow: solo (work on the default branch)."
      content: |
        ## Repo Setup
        - Solo/hobby repo — single default branch, no PR workflow.
        - codeberg.org is primary; github.com (if present) is a synced mirror only.
    fork:
      name: "Fork"
      rule: "Git workflow: fork (topic branch per ticket, PR against upstream)."
      content: |
        ## Repo Setup
        - This repo is a fork.
        - Keep the default branch in sync with upstream; never force-push over upstream history.
        - Open PRs against upstream from feature branches, not from the default branch.
        - codeberg.org is primary; github.com may carry contributor branches for upstream PRs.
    fork_protected:
      name: "Fork / protected main"
      rule: "Git workflow: fork, protected main (harnez refuses commits on main except `harnez release`; see Repo Setup)."
      content: |
        ## Repo Setup
        - This repo is a fork.
        - Keep the default branch in sync with upstream; never force-push over upstream history.
        - Open PRs against upstream from feature branches, not from the default branch.
        - codeberg.org is primary; github.com may carry contributor branches for upstream PRs.
        - main is protected; harnez refuses commits on it, except `harnez release`, which the repository admin or an agent asked to release may run there. Otherwise do not commit to or push the default branch unless the repository admin explicitly authorizes it in the current session. Never force-push.
    team:
      name: "Team"
      rule: "Git workflow: team (local topic branch, PR to merge; AGit where the forge supports it)."
      content: |
        ## Repo Setup
        - Team repo: work on a local topic branch and open a PR to merge. Tickets and small PRs on a forge with AGit (Forgejo, Gitea) reuse one local branch and push no branch: `git push origin HEAD:refs/for/<default-branch>/<topic>`.
        - Push a branch (`issue/<n>-<slug>`, `sprint/<n>`) for work others push to, long sprints that need rebasing, and GitHub, which has no AGit.
        - Update/rebase your branch before merging; follow this repo's CI and review requirements.
    team_protected:
      name: "Team / protected main"
      rule: "Git workflow: team, protected main (harnez refuses commits on main except `harnez release`; see Repo Setup)."
      content: |
        ## Repo Setup
        - Team repo: work on a local topic branch and open a PR to merge. Tickets and small PRs on a forge with AGit (Forgejo, Gitea) reuse one local branch and push no branch: `git push origin HEAD:refs/for/<default-branch>/<topic>`.
        - Push a branch (`issue/<n>-<slug>`, `sprint/<n>`) for work others push to, long sprints that need rebasing, and GitHub, which has no AGit.
        - main is protected; harnez refuses commits on it, except `harnez release`, which the repository admin or an agent asked to release may run there. Otherwise do not commit to or push the default branch unless the repository admin explicitly authorizes it in the current session. Never force-push.
        - Update/rebase your branch before merging; follow this repo's CI and review requirements.
