# Repo-local `harnez exec` runtime limit (built-in default: 60s). Precedence is
# --timeout > this exec.timeout > the built-in default. The implicit 60s default
# is exempt for `harnez agent start/resume`; this setting explicitly bounds them.
exec:
  timeout: 30m

# model: sonnet  # unmanaged by default, let user or client choose
effort: medium

# Artifacts formerly installed by harnez that `apply` removes during
# migrations. Keep this list spec-driven so renamed workflows do not linger
# indefinitely in user-level command/skill directories.
decommissioned:
