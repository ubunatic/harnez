# yaml-language-server: $schema=spec/schemas/config.schema.json
target_dir: ~/.claude

# feedback steers the Tool Feedback Protocol instruction injection (the
# `harnez rate` call-to-action below and its skill) — see issue 142.
# Setting disable_rate_protocol: true (or $HARNEZ_DISABLE_RATE_FEEDBACK to
# any truthy value) makes `harnez apply` omit and actively remove that
# instruction from ~/.claude/CLAUDE.md/AGENTS.md and the installed skill
# directories. It does NOT disable `harnez rate`, `harnez exec`, or
# `harnez stats` themselves — only the instruction that tells agents to
# call `harnez rate` in the first place.
feedback:
  disable_rate_protocol: false

# Existing user-owned global files only; apply never creates these files or symlinks.
# Section names are stable marker IDs; use retired_global_sections to retire a block.
global_section_targets:
  - ~/.claude/CLAUDE.md
  - ~/.codex/AGENTS.md
  - ~/.gemini/GEMINI.md
  - ~/.prime/agent/AGENTS.md
  - ~/.pi/agent/AGENTS.md
retired_global_sections:
  # Moved to the per-repo rules (.harnez/rules/Tools.md, rendered from agents_md below); the global copy
  # went stale and still recommended status:open, which hides Backlog tickets (2026-11-06).
  - Issue Tracker Discovery
  # Removed from global_sections in 7ca2481c (#415); its guidance now lives in .harnez/rules/Tools.md.
  - Agent-Filed Feedback
global_sections:
  - name: Process hygiene
    content: |
      ### Process hygiene
      - Never use `pkill -f`/`pgrep -f` with a pattern that can match your own shell command line.
        Match exact argv fields via `ps -eo pid,args`, or kill recorded PIDs.
      - Set `HTO=0` for long-running commands, tests, or waits run as background tasks/jobs.
      - The applications and code in the current repository are your sole product. Never proactively offer, volunteer, or initiate implementation in external repositories. Outside this repository, only read for context or file a requested/blocking issue.
  - name: Tool Feedback Protocol
    rate_feedback: true
    existing_only: true
    content: |
      ### Tool Feedback Protocol
      Harnez-tracked projects only (`issues/` present); omit ticket or skip otherwise.
      Rate a call only when it failed or produced an unexpected outcome — not routine successes:
      `harnez rate <tool_name> <1-5> "<1-line outcome summary>" "<project_folder>/<ticket_name>"`
      Example: `harnez rate Grep 1 "missed target, wrong file" harnez/117-harnez-rate-command`
      Score 5 flawless, 3 partial, 1 useless.
      If prompted after a long quiet stretch and nothing has failed, confirm with
      `harnez rate --ok` instead of staying silent — no tool name, score, or ticket required.

# Global copyable docs to install into ~/.claude/docs/ and ~/.prime/agent/docs/ on `apply`.
# Global docs are opt-in via `apply --docs <name>...` (or `--docs all` / `-d <name>...`) and default to empty.
docs: []

