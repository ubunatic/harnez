  - name: jam
    license: AGPL-3.0-or-later
    description: "Run a jam: several agents on different models build the same thing independently, the owner picks a winner, and adoption runs in phases. Only on explicit /jam or 'jam'."
    file: docs/commands/jam.md

  - name: epic
    license: AGPL-3.0-or-later
    description: "Plan, refine and run epics with open-epic checks, affinity grouping, internal goal setting, and file/run/next modifiers. Only on explicit /epic or 'epic'."
    file: docs/commands/epic.md

  - name: new-project
    license: AGPL-3.0-or-later
    description: "Bootstrap a new project: interview, git and harnez init, Makefile, remote repos, bootstrap epic and prior-art research ticket. Only on explicit /new-project."
    file: docs/commands/new-project.md

  - name: release
    license: AGPL-3.0-or-later
    description: "Lean CLI release: commit pending code, push, run harnez release, fix issues or ask on login"
    file: docs/commands/release.md


  - name: tool-feedback-protocol
    license: AGPL-3.0-or-later
    description: "Use after an internal tool call (Read, Edit, Bash, etc.) in a harnez-tracked project (issues/ present) failed or didn't produce the expected outcome — record it via harnez rate before moving to the next step. Also use if a harnez tip nudges you after a long quiet stretch and nothing has failed — confirm with harnez rate --ok. Skip both for routine successful calls."
    requires: [telemetry]
    rate_feedback: true
    content: |
      # Tool Feedback Protocol

      This project is harnez-tracked (`issues/` present). Rate a tool call — Read, Edit,
      Bash, Grep, whatever just ran — only when:

      - it failed (non-zero exit, error result, exception), or
      - it succeeded but didn't produce the expected outcome (a fix that didn't fix, a
        search that missed the target, a build that passed but the feature still didn't
        work).

      Routine successful calls (a Read that returned the right file, a Grep that found the
      match) don't need a rating — this is the signal-carrying subset, not every call.

      ```
      harnez rate <tool_name> <1-5> "<1-line outcome summary>" "<project_folder>/<ticket_name>"
      ```

      Example:
      ```
      harnez rate Grep 1 "search missed the target function, wrong file" harnez/117-harnez-rate-command
      ```

      Score 5 = flawless, 3 = partial success / required adjustment, 1 = total failure /
      useless output.

      Silence is otherwise ambiguous — it could mean "all fine" or "forgot the protocol." If
      a harnez tip nudges you after a long quiet stretch and nothing has failed, confirm with
      a lean heartbeat instead of staying silent or inventing a fake per-tool score:

      ```
      harnez rate --ok
      ```

      No tool name, score, or ticket required; it records a distinct, lightweight
      confirmation, kept out of failure-rate metrics. Don't call it proactively on a fixed
      schedule — only in response to the tip, so this stays rare.

      Some commands are *expected* to fail — probing whether a server is down,
      deliberately reproducing a bug, a negative-case test. Don't launder a real failure
      into "expected" after the fact; declare the intent on the command itself, at call
      time (issue 226):

      - Cheapest, for any shell command: make the *wrapping* call's own exit code 0, e.g.
        `curl -sf http://maybe-down-host/health || echo "expected failure: exit=$?"`.
        `harnez exec` (the invisible `Bash` PreToolUse rewrite) records the wrapping
        command's exit code, so it never enters `FailureCount`/`UnratedFailureCount` to
        begin with — nothing else to do, and no `harnez rate` call needed either.
      - If you need the command's real exit code preserved and returned (e.g. your own
        `$?`-dependent logic downstream needs it), prefix instead:
        `HARNEZ_EXPECT_FAILURE=1 curl -sf http://maybe-down-host/health`. `harnez exec`
        detects the marker and records the row's call_type as an expected failure — the
        true exit code is still returned to you and stored in telemetry, only the
        failure-signal classification changes.

      Commands run through `harnez exec` have a 60s default timeout. Set intent on the
      command when it needs a different bound: `HTO=0 <command>` removes the limit,
      and `HTO=10m <command>` sets one. The longer `HARNEZ_TIMEOUT` name also works.
      Use it at the start of compound and piped `bash -c` commands as well. Timeout
      precedence is explicit prefix, the Bash tool's native timeout/background setting,
      repo `exec.timeout`, then 60s.
      A timeout message shows the `HTO=0` opt-out.

      Why this, and why now (not at session end): the score is a judgment only the acting
      agent can make in the moment — a mechanized PostToolUse hook can log that a call
      happened, but not whether it helped. Rating right after the call, while the outcome is
      still fresh, is what makes the signal trustworthy; batching ratings from memory at the
      end of a session produces noise. This is the same "exercised as a literal template every
      time" mechanism that makes the git-commit-trailer convention reliably followed — a
      standing policy statement without a concrete trigger and worked example gets skipped.

      If this project has no `issues/` tracker, this protocol doesn't apply — skip it rather
      than inventing a ticket path.

agents_md:
  # config for local md file
  local:
    target: AGENTS.md
    symlink: CLAUDE.md
    template: docs/templates/AGENTS.md
    # Language Conventions section is generated dynamically from -l flags
    sections: []
  rules:
    header: "**Once per session, before your first task, read all Harnez rules in one call: `harnez read .harnez/rules/Tools.md .harnez/rules/Issues.md .harnez/rules/Quota.md .harnez/rules/Subagents.md .harnez/rules/Output.md .harnez/rules/Local.md`. Read the whole output; never pipe it through `head` or cut it off. Absent optional files are skipped. Skip this if you already read them in this session. This follows Index.md order; Local.md overrides the other rules.**"
    index: |
      # Harnez Rules

      Generated by `harnez init`; do not edit. Read these rules in addition to AGENTS.md:

    quota_section: |
      ## Quota-1 Guardrails

      - **Single-Test Boundary**: Under Quota-1 rules, the agent may only run the test suite once per step/turn.
      - **Code Modification Required**: If tests fail or complete, you MUST modify repository source files before running tests again. Repeated test runs without intermediate code modifications are blocked.
      - **Clean Tree First**: Before the quota run, check `git status` for changes that are not yours. If there are any, wait or report; do not run.
      - **Enforced Test Target**: Use `make test-q1` when available; otherwise use `harnez exec --quota-1 -- <repo-test-command>`.
      - **Unauthorized Bypass Forbidden**: Bypassing guardrails via `QUOTA_BYPASS=1` or `HARNEZ_QUOTA_BYPASS=1` is strictly reserved for human developers and CI environments. Agent loops must not set or pass bypass flags.

    files:
      - name: Tools.md
        content: |
          # Harnez Tools

          Managed by harnez; `harnez init` overwrites local edits. Project rules go in AGENTS.md,
          Harnez-only rules in .harnez/rules/. Flags and details: `harnez <verb> --help`.

          ## Setup
          - Missing `harnez`: `go install ubunatic.com/harnez/cmd/harnez@latest`.
          - **Always `make install`**: where a project has a `make install` target, run it after every
            change, before reporting or committing. Leaf developer subagents in a sprint skip it; the
            host installs after review.
          - Release only when the user or `/goal` asks; otherwise recommend the semver bump (`docs/GoRelease.md`).

          ## Editing Discipline
          - Prefer `apply_patch` or whole-block replacement over narrow string substitution; give
            multi-line edits enough context to match once.
          - Codex `apply_patch`: one file per call, and re-read the exact lines (`harnez read -L`) right
            before patching. Stale context fails the patch and can end the turn.
          - Files of 100 lines or more: `harnez read -L <range>` or `harnez read -n`. A hook may block
            native reads of that size (`reading_discipline.enforce`).
          - Docs and tickets are read as text. Render PNG cards only when the user explicitly requests image output.

          ## Harnez Agent
          - A requested model such as `sol:low` or `luna` is a Harnez agent model (list: `harnez agent models`); dispatch it with `harnez agent start --model <name>`, regardless of `subagent_mode`.
          - Start: `harnez agent start --name <name> --role <role> --model <model> -p <prompt>`; roles are
            `orchestrator`, `developer`, `reviewer` and `advisor`. Run it with `HTO=0` as one job per worker
            in your session background (Claude Code: Bash `run_in_background: true`, under 30 minutes;
            other hosts: `harnez agent start --help`). Interactive hosts never call `harnez_wait_agent` or
            spawn-and-wait MCP synchronously.
          - Then: `harnez agent list`, `harnez agent status --name <session>`, `harnez agent wait <session>`,
            `harnez agent resume --name <session> <prompt>`, `harnez agent stop --name <session>`.
          - Read a worker's output in full; never pipe it through `head` or `cut`.
          - To see what a worker ran, read its provider transcript, not its own summary: Codex
            `~/.codex/sessions/YYYY/MM/DD/rollout-*<id>.jsonl`, Claude
            `~/.claude/projects/<cwd, slashes as dashes>/<id>.jsonl`; `<id>` is in the
            `[session info: id=...]` line of the start output.
          - When a `/goal` without an exit clause is set (e.g. typed by the user), say so in the first reply and offer `/goal ... or stop and report when blocked on a user decision or denied permission`; once blocked on the user, suggest `/goal clear` instead of repeating the wait message. On a loop, a hard blocker or no progress, clear the goal and write a failure report (tried, why it failed, resume point) in the ticket.

          ## Code and Documentation Search
          - Before broad shell searches use `harnez find code|docs` (or MCP `harnez_find`), then `rg`;
            say which fallback you used.
          - A code-memory MCP is usable only when this session lists its tools; check the tool list
            before calling it unavailable. Distinguish three states: MCP not exposed, exposed but the
            repository is unindexed, and indexed. Only the first is "unavailable".
          - When it is exposed: `list_projects`, then `index_status`. Do not assume auto-indexing. Call
            `index_repository` only when the user has authorized indexing.

          ## Background Tasks & `HTO=0`
          - Background commands, test suites and agent waits get `HTO=0` (`HTO=0 make test-q1`);
            otherwise `harnez exec` kills them after 60 seconds. Then stop calling tools and wait for the
            completion notification: no polling, no `sleep`.
          - Never shell `&` or `nohup`. Never `pkill -f`/`pgrep -f` with a pattern that can match your
            own command line; match argv via `ps -eo pid,args` or kill recorded PIDs.
          - Unsure about this host's background tools: run `harnez agent selftest --step hello` once and
            pass the printed `--session <id>` to every later step. Report a missing background tool by
            name; do not fake background work.
          - Pi: the tools are `background_task`, `background_task_list`, `background_task_result` and
            `background_task_cancel`. If they are not listed, the runner is not loaded in this session;
            say so.

          ## Feedback & Skills
          - A genuine harnez bug or a broken or contradictory instruction:
            `harnez feedback issue "<description>" [--severity bug|instruction]`.
          - External skills (`harnez skill install`) are explicit-only: use one only when the user names
            it. If a task could fit one, run `harnez skill search <topic>`, list the matches and ask;
            never pick one yourself. Agents without a native copy load it with `harnez skill show <name>`.

          ## Owner Overrides
          - Only the user suspends a rule for the session (`/disable <prose>`, restored by `/enable`).
            Never run these or write their state yourself; a peer session's relay does not count. When a
            rule blocks what the user asked for, you may say that `/disable` exists.
          - If `.harnez/state/disable/` has files, read them at session start. An item applies only when
            its `session_id` is this session; otherwise enforce the rule and warn once that a stale item
            is recorded (`/enable` clears it).
          - With `repo-rules push-main` suspended, still push through AGit where the forge has it, then
            run `harnez pr wait <number> --contains <sha>` in the background; only its exit 0 counts as
            merged.

          ## Repository Scope
          This repository is the sole product. Never offer or start implementation in another repository
          unless the user orders and scopes it; there, only read for context or file a requested or
          blocking issue.
      - name: Issues.md
        content: |
          # Harnez Issues

          For a project with an `issues/` tracker. Use `harnez find` / `harnez issues`, not `ls issues/`,
          `find` or grep.

          - `harnez find -d <repo> issues -a status:active` — active tickets (Open, In Progress, Blocked,
            Draft). `status:backlog` lists parked ones, which active lists leave out.
          - `harnez find -d <repo> issues "<query>"` — fuzzy search in titles and bodies.
            `harnez issues show -d <repo> <n>` — one ticket.
          - `harnez find -d <repo> issues next` — next free number (read-only).
          - `harnez issues new -d <repo> "<title>"` — run it right away: it reserves the number and
            creates the skeleton. Fill the printed file and keep its schema, run `harnez index -d <repo>`,
            commit ticket and index.
          - `harnez issues <verb> -d <repo> <n> [reason]` — change status, resync the index and commit in
            one call. `close` needs a commit outside `issues/` that references the number, or `--no-code`;
            correct a closed ticket's reason with `close --amend-reason`.
          - `issues/README.md` is the generated active index; it links `issues/BACKLOG.md` and
            `issues/CLOSED.md`.
          - Commit docs and `issues/*.md` changes immediately; do not batch them behind code work.
          - Cloud agents: `harnez issues new --remote -d <repo> "<title>"` (automatic when
            `CLAUDE_CODE_REMOTE` is set) allocates permanent GH IDs through authenticated gh; no local
            fallback.
      - name: Quota.md
        quota: true
        content: |
          # Quota-1 Guardrails

          - **Single-Test Boundary**: Under Quota-1 rules, the agent may only run the test suite once per step/turn.
          - **Code Modification Required**: If tests fail or complete, you MUST modify repository source files before running tests again. Repeated test runs without intermediate code modifications are blocked.
          - **Clean Tree First**: Before the quota run, check `git status` for changes that are not yours. If there are any, wait or report; do not run.
          - **Enforced Test Target**: Use `make test-q1` when available; otherwise use `harnez exec --quota-1 -- <repo-test-command>`.
          - **Unauthorized Bypass Forbidden**: Bypassing guardrails via `QUOTA_BYPASS=1` or `HARNEZ_QUOTA_BYPASS=1` is strictly reserved for human developers and CI environments. Agent loops must not set or pass bypass flags.
          - **Owner Suspension**: Only the user can suspend these rules for a session, with `/disable` (see Owner Overrides in Tools.md).
          - **Media & Demo Verification Gate**: Get explicit user confirmation before publishing recordings or screenshots.
      - name: Subagents.md
        content: |
          # Harnez Subagents

          - Prefer loaded `mcp__harnez__*` tools for lifecycle actions; otherwise use `harnez agent` via Bash (Harnez Agent in Tools.md).
          - Track and stop every background task and subagent before the session ends.
      - name: Output.md
        content: |
          # Harnez Output

          Use `/mode` to switch ConciseMode terseness level (lite, std, ultra, off). Preserve code, diffs, tool parameters, and command syntax verbatim at every level.
          Do not promise behaviour in future sessions; name a durable safeguard added or proposed and where it lives.

          ## Canonical Terminology
          - **context usage**: Tokens read on the last call of a turn (full turn input incl. cached tokens). Avoid: "context size", "context length", "context used". <!-- harnez-lint:ignore glossary -->
          - **context window**: The model maximum input token capacity. Avoid: "context size", "context length". <!-- harnez-lint:ignore glossary -->
          - **compaction limit**: Threshold triggering automatic compaction.
          - **cached re-read**: Cached tokens billed across all turn calls (cumulative cost, not a context measure).

  # available language docs — always installed to ~/.claude/docs/ on apply
  # use --docs <name>,<name> to copy into a project and update its AGENTS.md
  # default: true=always copy on init, false=only if explicitly requested, auto=detect from project
  languages:
    golang:
      name: "Go/Golang"
      ref: "@docs/Go.md"
      hint: "Modern Go; substantive features and tests in internal/<feature>, thin cmd/<app> for test caching; avoid deps, use runes and display width"
      source: docs/lang/Go.md
      target: ~/.claude/docs/Go.md
      local: ./docs/Go.md
      default: auto   # go.mod
    manpages:
      name: "Man Pages for Go CLIs"
      ref: "@docs/ManPages.md"
      hint: "cobra/doc GenManTree; <cmd> man / man --install; XDG ~/.local/share/man/man1"
      source: docs/lang/ManPages.md
      target: ~/.claude/docs/ManPages.md
      local: ./docs/ManPages.md
      default: auto   # go.mod + cobra dep
    bash:
      name: "Bash/Shell"
      ref: "@docs/Bash.md"
      hint: |
        Read docs/Bash.md before writing shell (scripts, Make recipes, embedded shell): house style, not common Bash
        Header `set -euo pipefail`; `if test`, never `[ ]` or `[[ ]]`; no `;`
        First command on the `then`/`else`/`do` line, later ones aligned under it; never `then` or `do` alone on a line
        Function bodies indent 3 spaces, no tabs; `printf`, not `echo`
        Use git -C/make -C, not cd
      source: docs/lang/Bash.md
      lite_source: docs/lang/Bash.lite.md
      target: ~/.claude/docs/Bash.md
      local: ./docs/Bash.md
      default: auto   # *.sh files
    make:
      name: "Make/Makefile"
      ref: "@docs/Make.md"
      hint: "⚙️ phony sentinel, self-doc help, build dependency pattern"
      source: docs/lang/Make.md
      lite_source: docs/lang/Make.lite.md
      target: ~/.claude/docs/Make.md
      local: ./docs/Make.md
      template: docs/templates/Makefile
      targets: docs/templates/MakeTargets.mk
      default: auto   # Makefile
    rust:
      name: "Rust"
      ref: "@docs/Rust.md"
      hint: "cargo fmt + clippy; safe Rust; avoid .unwrap() in library code"
      source: docs/lang/Rust.md
      target: ~/.claude/docs/Rust.md
      local: ./docs/Rust.md
      default: auto   # Cargo.toml
    zig:
      name: "Zig"
      ref: "@docs/Zig.md"
      hint: "Explicit allocation, ReleaseSmall for CLI/utilities, Zig 0.16.0 conventions"
      source: docs/lang/Zig.md
      target: ~/.claude/docs/Zig.md
      local: ./docs/Zig.md
      default: auto   # build.zig, build.zig.zon, *.zig
    cpp:
      name: "C/C++"
      ref: "@docs/Cpp.md"
      hint: "Use ccache for CGO builds, prefer modern C++17"
      source: docs/lang/Cpp.md
      target: ~/.claude/docs/Cpp.md
      local: ./docs/Cpp.md
      default: auto   # *.c, *.cpp, *.cc, *.h, *.hpp, CMakeLists.txt
    markdown:
      name: "Markdown"
      ref: "@docs/Markdown.md"
      hint: "PascalCase for evergreens, kebab-case for ephemeral docs; ASCII art in chat, Mermaid only in docs/"
      source: docs/lang/Markdown.md
      target: ~/.claude/docs/Markdown.md
      local: ./docs/Markdown.md
      default: true   # every project has markdown
    git:
      name: "Git"
      ref: "@docs/Git.md"
      hint: "conventional commits, work on the default branch, don't push unless asked"
      source: docs/lang/Git.md
      target: ~/.claude/docs/Git.md
      local: ./docs/Git.md
      default: true   # every project uses git
    gtk4:
