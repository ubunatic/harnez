name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  # Lets cloud agents run CI on their branch without a PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: "off"
    steps:
      # LFS: internal/bench validates the saved sessions in docs/data.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/install-dev-deps.sh
      - run: git --version
      - run: go build ./...
      - run: make build
      - run: make lint
      # make check: gofmt, go vet and go test, as in make container-test.
      # Raw logs need admin rights to download, so test output goes to JSON
      # and failures are summarised into the step summary and annotations
      # (readable with gh run view).
      - name: make check
        id: check
        run: make check TESTFLAGS=-json > check.json 2>&1
      - name: summarise make check failures
        if: failure() && steps.check.outcome == 'failure'
        run: go run ./scripts/gotest-summary check.json
      - name: go test -race
        id: race
        run: go test -race -json ./... > race.json 2>&1
      - name: summarise race failures
        if: failure() && steps.race.outcome == 'failure'
        run: go run ./scripts/gotest-summary race.json
