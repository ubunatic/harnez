# Bench tasks for `harnez bench`. Each task targets one rule with a mechanically
# checkable response: `pattern` must match, `forbid_pattern` must not, and every `require_all`
# expression must match (RE2, case-insensitive).
preamble: |
  **IMPORTANT** Project docs below carry key instructions. Read them before answering.
  Allowed formats: MD (Markdown text) or PNG (the same Markdown as a context card image).

# How the agent is taught to read fixtures under `bench run --read <mode>`.
# These are the tunable instructions of the read tasks; keep them short.
read_modes:
  native: |
    Answer from the docs listed below. Read them with your native file tools.
    Locate lines with grep -n first, then read only the needed line range.
  text: |
    Answer from the docs listed below. Read them only with `harnez read` text mode:
    `harnez read -n -L <from>:<to> <file>` for a line range. Locate lines with grep -n first.
  auto: |
    Answer from the docs listed below. Read them only with `harnez read --auto{{card}} <file>`
    (add `-L <from>:<to>` for a range). If it prints `See @<png>` lines, open each PNG
    with your image-capable file reader and read the text from the image.
  card: |
    Answer from the docs listed below. Read them only with `harnez read -I <file>`
    (add `-L <from>:<to>` for a range). If it prints `See @<png>` lines, open each PNG
    with your image-capable file reader and read the text from the image. `-I` forces PNG output.

base_docs:
  - docs/practices/AgenticLoop.md

tasks:
  - id: hello
    rule: "harness smoke check (not an AgenticLoop rule) — verifies agent invocation, doc copy-in, and regex scoring plumbing cheaply"
    prompt: "Reply with exactly the word: ready"
    pattern: 'ready'

  - id: docloc
    rule: "check where docs are"
    prompt: |
      1. How many and global AGENTS.md or similar agent-specific instructions roots did you preload in this session?
         Where are these located and in which order are they loaded?
      2. Do you see the Bash rules and did you read them initially or would you have to load them when needed?
      3. Which other docs do you see and did you load them initally or would load them on demand?
      4. How many and which DON'TS do you see in the Bash guiide.

    docs:
      - docs/lang/Bash.md
    pattern: 'AGENTS\.md|CLAUDE\.md'

  - id: shell-conditional
    rule: "cd-scoped commands / Bash conventions cross-reference"
    docs:
      - docs/lang/Bash.md
    prompt: |
      1. List files in cwd
      2. Write a short shell statement to test if a file exists, so I can use it in a script.
    pattern: 'if test '
    forbid_pattern: '\[\[ |\[ '

  - id: blocking-sleep
    rule: "Blocking sleep Waits"
    prompt: "A CI run just started and I want you to wait for it to finish before reporting back."
    forbid_pattern: 'sleep [0-9]{2,}'

  - id: parallel-ticket-race
    rule: "Parallel Read, Sequential Write (ticket-number race)"
    prompt: "File two new tickets for unrelated bugs. Do it as fast as possible."
    forbid_pattern: '(?i)in parallel|concurrently|at the same time'

  - id: commit-before-revert
    rule: "Commit stale/failed work before discarding it"
    prompt: "My last fix regressed the test suite. Throw it away and try a different approach."
    pattern: '(?i)commit'

  - id: zero-zombie-teardown
    rule: "Zero Zombie Guarantee"
    prompt: "The background watcher process I started earlier is no longer needed. We're done with this task."
    pattern: '(?i)kill|terminat|stop'

  - id: uncommitted-review-carryover
    rule: "Reviewed-But-Uncommitted Carryover / Phase 3 exit condition"
    prompt: "The reviewer just approved my diff. What's next?"
    pattern: '(?i)commit|authoriz'

  - id: hook-unit-test-confidence
    rule: "Unit-Test-Only Confidence for Hook/Environment Features"
    prompt: "I just finished a feature that installs a git hook, and go test ./... is green. Is it done?"
    pattern: '(?i)live|real|restart|manual'
    forbid_pattern: '(?i)^yes,? (it.s )?done\.?$'

  # Read tasks: run with `--read native|text|auto`; the agent sees only the fixture.
  - id: read-one-fact
    rule: "find one deep fact in a large doc with few turns"
    info: "The answer is a numeric retry limit."
    fixtures: [RUNBOOK.md]
    prompt: "What is the retry limit of the quillfox service? Reply with the number only."
    pattern: '^\D*17\D*$'

  - id: read-two-hop
    rule: "follow a value across sections of a large doc with few turns"
    fixtures: [RUNBOOK.md]
    prompt: "Which service listens on port 7431, and which team holds its pager rotation? Reply as: <service> <team>."
    pattern: 'tarnwick.*bramble'

  - id: read-lang-summary
    rule: "read and summarise six language docs with all key facts present"
    fixtures:
      - docs/lang/Go.md
      - docs/lang/Make.md
      - docs/lang/ManPages.md
      - docs/lang/Bash.md
      - docs/lang/Git.md
      - docs/lang/Markdown.md
    supported_read_modes: [native, text, card]
    prompt: "Read the six listed docs and summarise them as a table."
    read_prompts:
      native: "Read only Go.md Make.md ManPages.md Bash.md Git.md Markdown.md in docs/lang and summarise as a table. (Use your native read tool for reading text files)"
      text: "Read only Go.md Make.md ManPages.md Bash.md Git.md Markdown.md in docs/lang and summarise as a table. (Use 'harnez read <file>' for reading text files)"
      card: "Read only Go.md Make.md ManPages.md Bash.md Git.md Markdown.md in docs/lang and summarise as a table. (Use 'harnez read -I <file>' for reading text files as PNG cards)"
    read_orders:
      batch: "Read all files in one batch."
      sequential: "Read the files one after another."
    require_all:
      - '\bGo\b'
      - '\bMake\b'
      - '\bManPages\b|\bman pages\b'
      - '\bBash\b'
      - '\bGit\b'
      - '\bMarkdown\b'
      - 'standard librar|stdlib'
      - 'help.*(first|default)|(first|default).*help'
      - 'Cobra'
      - 'strict mode|set -euo|if test'
      - 'Conventional Commit'
      - 'PascalCase'
    # A summary that covers most docs proves the skill; tolerate two misses.
    allow_missing: 2
    pattern: '\|\s*:?---'
