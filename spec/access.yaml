# yaml-language-server: $schema=schemas/access.schema.json
# Directories harnez needs readable or writable. A caller that grants these paths
# (a taia profile, a sandbox, or a human) lets harnez run. harnez reports them with
# `harnez config --access` and does not pick a mode from them. The session store
# and the spool are resolved in code (HARNEZ_STORE_DIR, HARNEZ_SPOOL_DIR) and are
# reported there, not listed here.
# root: home | repo | tmp | xdg_data_home | xdg_state_home | xdg_cache_home | xdg_runtime_dir
version: 1
entries:
  - id: user_config
    root: home
    path: .harnez/config.yaml
    access: read
    purpose: user config (models, costs, tool limits)
  - id: repo_config
    root: repo
    path: .harnez
    access: readwrite
    purpose: repo.yaml, rules and quota state
  - id: telemetry
    root: xdg_data_home
    path: harnez
    access: readwrite
    purpose: telemetry database and usage exports
  - id: state
    root: xdg_state_home
    path: harnez
    access: readwrite
    purpose: model access locks and tool-limit state
  - id: cache
    root: xdg_cache_home
    path: harnez
    access: readwrite
    purpose: quota cache
  - id: process_records
    root: xdg_runtime_dir
    path: harnez/procs
    access: readwrite
    purpose: process records for exec and clean
