# yaml-language-server: $schema=schemas/issues.schema.json
# Lifecycle terms used by issue parsing and find filters.
lifecycle:
  unresolved: [open, in-progress, blocked, draft, backlog]
  fallback_order: [draft, closed, open]
  statuses:
    - key: open
      label: Open
      category: Open
      filters: [open, active]
      match_mode: lead_contains
      match_terms: [open, in progress, blocked, investigating, in review]
      fallback_terms: [open, in progress, blocked, partially, in review]
    - key: in-progress
      label: In Progress
      category: Open
      filters: [open, in-progress, active]
      match_mode: lead_exact
      match_terms: [in progress]
    - key: blocked
      label: Blocked
      category: Open
      filters: [open, blocked, active]
      match_mode: lead_exact
      match_terms: [blocked]
    - key: closed
      label: Closed
      category: Closed
      filters: [closed]
      match_mode: lead_contains
      match_terms: [closed, resolved, fixed, complete, completed, implemented, invalid]
      fallback_terms: [closed, resolved, fixed, complete, completed, implemented, invalid]
    - key: draft
      label: Draft
      category: Draft
      filters: [draft, active]
      match_mode: lead_contains
      match_terms: [draft, wip, proposal]
      fallback_terms: [draft, wip, proposal]
    - key: backlog
      label: Backlog
      category: Backlog
      filters: [backlog]
      match_mode: lead_exact_dash
      match_terms: [backlog]
    - key: done
      label: Closed
      category: Closed
      filters: [closed]
      match_mode: lead_token
      match_terms: [done]
duplicate_gate:
  threshold: 0.65
  idf_smoothing: 1.0
  max_results: 5
  minimum_query_tokens: 2
  minimum_token_length: 3
  title_weight: 3
  body_weight: 1
  stopwords: [a, an, and, are, as, at, be, by, for, from, has, have, in, into, is, it, its, of, on, or, that, the, their, this, to, was, were, what, where, which, who, why, with]

issue_index:
  active_cap: 20
