# yaml-language-server: $schema=schemas/tui.schema.json
# Default layout, behavior, and keybindings for `harnez tui`.
header:
  show: true
  # Status and backend first: narrow terminals clip the right edge.
  format: "harnez tui {{ .Status }} {{ .Backend }} · {{ .Model }} · {{ .SessionID }}"
  status_indicators:
    idle: "● ready"
    busy: "◐ thinking"
    error: "✖ error"

chat:
  min_height: 5
  max_scroll_back: 1000
  show_timestamps: true
  user_prefix: "User:"
  assistant_prefix: "Agent ({{ .Model }}):"
  tool_prefix: "[Tool: {{ .Name }}]"
  error_prefix: "Error:"
  # Neutral note (no error prefix) shown when a running turn is cancelled.
  cancelled_label: "Cancelled"

input:
  history_size: 100
  min_lines: 3
  max_lines: 10
  prompt_symbol: "> "

# Backend (provider CLI) session ids per tui session, so `harnez tui --session X`
# resumes the claude/codex/agy/pi sessions natively after a restart.
sessions:
  # One <tui session id>.json per tui session; "~/" is the home directory.
  dir: "~/.harnez/tui/sessions"
  # Store files of other tui sessions unused this long are deleted on tui start.
  max_age_days: 30
  # {{ .Backend }} in header.format after a turn: resumed vs new backend session.
  labels:
    resumed: "[resumed]"
    new: "[new session]"

# Terminal protocol options for the loom pane.
terminal:
  # Kitty keyboard protocol: Shift+Enter and Ctrl+J arrive as distinct keys.
  # Terminals without support ignore it.
  kitty_keyboard: true

# External prompt editor (open_editor key): $VISUAL, then $EDITOR, then the
# first fallback found on PATH.
editor:
  fallbacks: ["nvim", "vim", "nano", "vi"]
  temp_pattern: "harnez-prompt-*.md"

# open_native key: hands the terminal to the provider's own interactive CLI,
# resuming the backend session of the active model (claude --resume, codex
# resume, agy --conversation; the argv of `harnez agent resume -i`). The tui
# returns when that CLI exits and keeps its stored backend session id.
# agy runs without the metering supervisor and HARNEZ_SESSION_ID that
# `harnez agent resume -i` adds, so that native time is not metered.
# Placeholder: {{ .Provider }}.
native:
  labels:
    returned: "returned from {{ .Provider }}"
    unsupported: "native session not supported for {{ .Provider }}"
    no_session: "no {{ .Provider }} session yet; send a prompt first"
    busy: "a turn is running; wait or press Esc to cancel it first"
    unavailable: "native session needs an interactive terminal"
    # A stored id with unsafe characters is dropped before it reaches argv.
    invalid_session: "dropped an invalid stored {{ .Provider }} session id"

# Background jobs: a prompt starting with prefix runs the rest as
# `<shell> -c <command>` in the tui working directory, in its own process group.
jobs:
  prefix: "!"
  shell: "sh"
  # Output (stdout+stderr) kept per job; older bytes are dropped.
  log_buffer_bytes: 262144
  # Cancel sends SIGTERM to the job's process group, then SIGKILL after this.
  cancel_grace_ms: 3000
  # Ended jobs kept in the panel; older ones are dropped (running jobs stay).
  max_finished: 50
  labels:
    started: "job {{ .ID }} started: {{ .Command }}"
    done: "job {{ .ID }} {{ .Status }} (exit {{ .Exit }}, {{ .Duration }}): {{ .Command }}"
    usage: "usage: !<shell command>"
    unavailable: "background jobs need an interactive terminal"
    panel_title: "Jobs"
    log_title: "Job {{ .ID }} ({{ .Status }}): {{ .Command }}"
    panel_empty: "no jobs yet; start one with !<command>"
    panel_hint: "↑/↓ select · enter log · x cancel · esc close"
    log_hint: "↑/↓ pgup/pgdn scroll · end follow · x cancel · esc back"
    header_running: "[jobs: {{ .Running }} running]"

# Inline completion pickers, drawn above the prompt at the caret. The file
# trigger opens at the start of a word, the command trigger only at the very
# start of the prompt. Selecting replaces the token under the caret (up to the
# next whitespace) with "<trigger><name> ". A file name with whitespace is
# inserted as @"my file.go": Claude Code reads that form and other agents take
# it as one quoted path.
picker:
  file_trigger: "@"
  command_trigger: "/"
  max_items: 8
  max_width: 72
  # The file index (git ls-files incl. untracked, minus .gitignore) is built
  # once per session on first use and stops after this many files.
  max_indexed_files: 20000
  # Outside a git work tree the file index walks the directory tree and skips
  # hidden directories plus any directory with one of these names, at any depth.
  skip_dirs: ["node_modules", "vendor", "target", "dist", "build", "__pycache__", "venv"]
  # TUI commands handled before a prompt reaches the model (this list is the only
  # place command names live; code only binds a handler to each name); installed skills
  # (SKILL.md under the agent skill dirs) follow them in the command picker.
  builtins:
    - name: "model"
      description: "switch the active model: /model <provider:model[:tier]>"
      usage: "/model <provider:model[:tier]>"
  labels:
    files_title: "Files"
    commands_title: "Commands"
    indexing: "indexing…"
    no_matches: "no matches"
    # Shown instead of no_matches when the directory walk failed.
    read_error: "cannot read files: {{ .Error }}"

# Key names follow loom ("ctrl+j" == "ctrl-j"). Without the kitty keyboard
# protocol, Ctrl+J and Shift+Enter arrive as Enter (send), so newline also
# accepts Alt+Enter and a trailing "\" + Enter.
keybindings:
  send_prompt: ["enter"]
  newline: ["shift+enter", "ctrl+j", "alt+enter"]
  quit: ["ctrl+c", "esc"]
  # While a turn runs, these keys cancel it instead of quitting.
  cancel_turn: ["esc", "ctrl+c"]
  scroll_up: ["pgup"]
  scroll_down: ["pgdn"]
  open_editor: ["ctrl+g"]
  # Open the active model's backend session in the provider's own CLI.
  open_native: ["ctrl+o"]
  # Job panel: toggle anywhere; open/cancel/close act inside the panel.
  toggle_jobs: ["ctrl+b"]
  job_open: ["enter"]
  job_cancel: ["x"]
  job_close: ["esc"]
  # Readline-style prompt editing, on the current line of a multi-line prompt.
  # A word is letters, digits and "_"; "/" and "." separate words. Alt+B/F
  # arrive as alt-b/alt-f (terminals must send Meta as Escape).
  line_start: ["ctrl+a", "home"]
  line_end: ["ctrl+e", "end"]
  delete_to_start: ["ctrl+u"]
  delete_to_end: ["ctrl+k"]
  delete_word: ["ctrl+w"]
  word_left: ["alt+b", "ctrl+left"]
  word_right: ["alt+f", "ctrl+right"]
  # Pickers: while one is open these keys act on it (Enter selects, never sends).
  picker_select: ["tab", "enter"]
  picker_close: ["esc"]
  picker_up: ["up", "ctrl+p"]
  picker_down: ["down", "ctrl+n"]

theme:
  border_style: "sharp"
  header_color: "bold"
  user_color: "chart-cool"
  assistant_color: "chart-green"
  tool_color: "dim-grey"
  input_color: "bold"
