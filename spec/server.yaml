# yaml-language-server: $schema=schemas/server.schema.json
socket_path: server.sock
read_header_timeout: 5s
shutdown_timeout: 5s
http_client_timeout: 5s
probe_timeout: 1s
usage_deadline: 10s
update_timeout: 100ms
update_max_body_bytes: 65536
telemetry_update_path: /telemetry/record
usage_query_path: /usage/query
telemetry_spool_path: telemetry-spool
telemetry_spool_max_bytes: 10485760
startup_timeout: 30s
startup_poll_interval: 100ms
takeover_timeout: 5s
systemd_unit_name: harnez-agent-collector.service
systemd_unit_source: systemd/harnez-agent-collector.service
systemd_restart_policy: on-failure
systemd_restart_delay: 5s
telemetry_warning_rate_limit: 1m
default_log_lines: 50
remote_upgrade:
  install_path: ~/go/bin/harnez
  connect_timeout: 5s
  command_timeout: 15s
  transfer_timeout: 60s
neus_indexing:
  enabled: false
  interval: 5m
  timeout: 10m
  command: [neus, index]
  service_name: neus-indexer.service
  repos: []
runner_channel:
  fd_env: HARNEZ_BROKER_FD
  max_frame_bytes: 1048576
  frame_headroom_bytes: 512
  spool_max_bytes: 1048576
  replay_max_records: 64
  replay_max_bytes: 524288
  max_concurrent_streams: 32
  usage_query_max_models: 64
  usage_query_max_string_len: 128
  allowed_telemetry_kinds:
    - tool_call
    - agy_post_tool
    - codex
    - agy_compaction
    - cli_invocation
    - issue_snapshot

