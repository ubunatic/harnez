# yaml-language-server: $schema=schemas/indicators.schema.json
#
# One-cell status indicators used by `harnez usage --watch`. Consumers refer
# to this registry by name; the usage loader resolves frames before rendering.
# `kind` prevents a finite gauge from silently selecting a cyclic spinner (or
# a graph-specific scale from being used by an incompatible renderer).
sequences:
  block-deplete-8:
    title: "Eighth-block countdown"
    kind: countdown
    frames: ["█", "▉", "▊", "▋", "▌", "▍", "▎", "▏", " "]
  block-deplete-vertical-8:
    title: "Vertical-block countdown"
    kind: countdown
    frames: ["█", "▇", "▆", "▅", "▄", "▃", "▂", "▁", " "]
  shade-deplete-5:
    title: "Shade countdown"
    kind: countdown
    frames: ["█", "▓", "▒", "░", " "]
  quadrant-rotate-4:
    title: "Quadrant spinner"
    kind: spinner
    frames: ["▘", "▝", "▗", "▖"]
  half-block-rotate-4:
    title: "Half-block spinner"
    kind: spinner
    frames: ["▄", "▌", "▀", "▐"]
  box-line-rotate-4:
    title: "Box-line spinner"
    kind: spinner
    frames: ["╷", "╴", "╵", "╶"]
  braille-orbit-8:
    title: "Braille orbit"
    kind: spinner
    frames: ["⡀", "⠄", "⠂", "⠁", "⠈", "⠐", "⠠", "⢀"]
  braille-classic-10:
    title: "Classic Braille spinner"
    kind: spinner
    frames: ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
  braille-snake-2x3:
    title: "2×3 Braille timeout snake"
    kind: countdown
    frames: ["⠿", "⠷", "⠧", "⠇", "⠃", "⠁", "⠀"]
  horizontal-eighths-7:
    title: "Horizontal eighth-block partial fill"
    kind: bar-partial
    frames: ["▏", "▎", "▍", "▌", "▋", "▊", "▉"]
  vertical-block-scale-8:
    title: "Vertical block scale"
    kind: sparkline
    frames: ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
#
# timeout-snake is a finite, time-derived depletion: it begins as a full
# braille cell when a refresh arrives and drains in the declared order to an
# empty cell as the next refresh becomes due. It does not loop or spin after
# timeout; the empty final frame truthfully represents no time remaining.
timeout-snake:
  title: "Time gauge braille snake"
  sequence: braille-snake-2x3

# Every glyph that draws a quota bar in `usage --watch`. `sub-character`
# progresses from one eighth to seven eighths; `filled` completes a cell.
#
# style (issue 220) selects the bar's glyph vocabulary: "block" keeps the
# eighth-block rendering (still available, and still what filled/empty/
# sub-character-sequence below configure); "braille" quantizes each cell to
# empty/half/full using the `braille` glyphs, matching the Braille visual
# language load charts already use. Only one style is active at a time;
# switch by changing style and filling in braille.full/half/empty (all three
# are required once style is "braille"). This spec ships with style: braille
# as the default usage-bar look; revert to style: block (and drop/ignore the
# braille block) to restore the historical eighth-block rendering.
#
# wrapper (issue 159) controls the `[`/`]` brackets drawn around each bar.
# enabled: false renders the bar glyphs alone (rograph.BarOptions.NoWrapper);
# left/right override the bracket glyphs themselves and are ignored when
# enabled is false. This ships with brackets on so default behavior is
# unchanged unless this file is edited.
usage-bar:
  filled: "█"
  empty: "░"
  sub-character-sequence: horizontal-eighths-7
  style: braille
  braille:
    full: "⣿"
    half: "⡇"
    empty: "⠀"   # U+2800 BRAILLE PATTERN BLANK, a blank Braille cell
  wrapper:
    enabled: true
    left: "["
    right: "]"

# CPU and GPU load timelines map 0% through 100% in this declared order.
load-sparkline:
  sequence: vertical-block-scale-8

# All chart surfaces resolve this one named background from spec/colors.yaml.
# Defaults to `background` (terminal-native/transparent background with no forced ANSI SGR).
# Set to `panel-bg` to explicitly opt into a shared black chart field (`sgr: "40"`).
# Use the restrained btop-style heat ramp for history and current percentages;
# set `monochrome` to disable their foreground colors.
chart-background: background
load-chart-presentation: heat
# Quota/usage bars are independent of load histories. `heat` colors a filled
# bar and its adjacent percentage with the shared cool-to-warm palette; set
# `monochrome` to disable it.
usage-bar-presentation: heat

# heat-bands (issue 223) are the three ascending upper-bound percentages that
# split the shared four-color heat ramp -- chart-cool/chart-green/
# chart-yellow/chart-warm (spec/colors.yaml) -- into its bands: 0-band[0] is
# cool, >band[0]-band[1] is green, >band[1]-band[2] is yellow, and
# >band[2]-100 is warm. Shared by both load-chart-presentation and
# usage-bar-presentation heat coloring. Omit to use the historical [25, 50,
# 75] default.
heat-bands: [25, 50, 75]

# Presentation modes for hardware load indicators in `usage --watch`.
# Supported modes: sparkline (or timeseries), braille (or btop), bar (or gauge).
# Braille maps two chronological samples into each terminal cell, using its
# left and right dot columns respectively. Block sparklines use the same
# doubled sample window while retaining the newer sample from each pair.
load-charts:
  cpu: btop
  gpu: btop
  ram: btop
  vram: btop

# Live microphone input level meter configuration (issue 245, 257, 258, 260).
# high-fps controls speech-activated high-frequency redraws:
#   "auto" (default): dynamic 10-20 FPS when speech/sound is active, idle 1s during silence
#   "on": continuous high FPS while the Mic box is visible
#   "off": strictly 1s normal redraws only
# normal-delay-ms: baseline redraw delay during silence / idle (e.g. 1000ms)
# high-fps-delay-ms: speech-activated high-frequency redraw delay (e.g. 50ms)
# value: metric to display across the rolling sample window:
#   "max" (default): peak level across window (fast attack, clear speech transients)
#   "avg": mean RMS across window
#   "min": minimum level across window
#   "live": instantaneous last sample
# window-seconds: duration of rolling sample window in seconds (e.g. 0.1 for 100ms)
# decay-ms: visual decay half-life / release duration in milliseconds (issue 260)
#   for smooth equalizer-style falloff ballistics; set to 0 for raw instantaneous snap
mic-live:
  high-fps: auto
  normal-delay-ms: 1000
  high-fps-delay-ms: 50
  value: max
  window-seconds: 0.1
  decay-ms: 150



