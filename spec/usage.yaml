# yaml-language-server: $schema=schemas/usage.schema.json
agy_meter_max_age: 5m
agy_quota:
  default_pool: Claude and GPT models
  # First matching model rule wins; Argon has its own weekly pool.
  model_pools:
    - contains: [argon]
      pool: Gemini 4 Argon
    - contains: [gemini, flash, pro]
      pool: Gemini Models
  meter_buckets:
    - {bucket: gemini-weekly, group: Gemini Models, window: Weekly Limit Remaining}
    - {bucket: gemini-5h, group: Gemini Models, window: Five Hour Limit Remaining}
    - {bucket: gemini-argon-wtu-weekly, group: Gemini 4 Argon, window: Gemini 4 Argon Weekly Limit}
    - {bucket: 3p-weekly, group: Claude and GPT models, window: Weekly Limit Remaining}
    - {bucket: 3p-5h, group: Claude and GPT models, window: Five Hour Limit Remaining}
collector_cadence: 5m
# Recollect after this many collector ticks; availability uses the same age.
cache_staleness_multiplier: 2
# Keep last-known usage visible through temporary collector outages.
display_staleness: 168h
# Before agent start/resume: inclusive warning threshold, per-window reading age.
agent_quota_warn_percent: 80
agent_quota_max_reading_age: 2m
collector_timeout: 2m
passive_dedupe_interval: 30s
passive_update_path: /usage/passive
# Live collection (usage, usage --watch) records a usage-history snapshot per
# host at most this often; `harnez usage export` reads these (issue 735).
history_snapshot_interval: 15m
# Path relative to $XDG_DATA_HOME/harnez for HMAC key used to hash host labels in usage export (issue 735).
export_host_key: export-host-key
# Compact projection does not wait long to persist freshly collected readings.
usage_store_busy_timeout: 25ms
# Client heartbeat and catch-up fetch parameters (issue 714 M3).
client_heartbeat_interval: 10s
client_timeout: 30s
catchup_fetch_threshold: 1m
# NVIDIA GPUs are read via nvidia-smi (issue 765). One call costs ~123ms, and
# the Load box redraws every 100ms, so each reading is reused for the TTL and
# a hung call is cut off at the timeout.
nvidia_smi_timeout: 1s
nvidia_smi_cache_ttl: 2s

watch_loading_label: Collecting usage…
view_modes:
  default: normal
  modes:
    # normal is the plain usage table: one row per quota window, no boxes.
    normal:
      panels: [table]
      token_details: true
      title_bar: true
      status_bar: true
      hidden_list: false
      overflow_hint: true
    compact:
      panels: [all_usage, load, remote_load]
      token_details: true
      title_bar: true
      status_bar: true
      hidden_list: true
      overflow_hint: true
    minimal:
      panels: [all_usage, load, remote_load]
      token_details: true
      title_bar: false
      status_bar: false
      hidden_list: false
      overflow_hint: false
