# yaml-language-server: $schema=schemas/usage.schema.json
agy_meter_max_age: 1h
collector_cadence: 15m
collector_timeout: 2m
passive_dedupe_interval: 30s
statusline_busy_timeout: 25ms
watch_loading_label: Collecting usage…
view_modes:
  default: normal
  modes:
    normal:
      panels: [claude, agy, codex, history, load, remote_load]
      token_details: true
      title_bar: true
      status_bar: true
      hidden_list: true
      overflow_hint: true
    compact:
      panels: [all_usage, load, remote_load]
      token_details: true
      title_bar: true
      status_bar: true
      hidden_list: true
      overflow_hint: true
    minimal:
      panels: [all_usage, load, remote_load]
      token_details: true
      title_bar: false
      status_bar: false
      hidden_list: false
      overflow_hint: false
    # Issue 687: --dashboard adds an Actions panel. Under --watch or --tui an
    # action's key (or, with --tui, a click) runs `harnez <args>`. Keys must be
    # unused in actions.yaml (e.g. "a" already toggles All Usage).
    dashboard:
      panels: [claude, agy, codex, history, load, remote_load, actions]
      token_details: true
      title_bar: true
      status_bar: true
      hidden_list: false
      overflow_hint: true
      actions:
        - title: Agent sessions
          key: s
          args: [agent, list]
        - title: Usage history
          key: h
          args: [usage, history]
        - title: Usage options
          key: o
          args: [usage, --help]
