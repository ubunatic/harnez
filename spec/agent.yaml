# yaml-language-server: $schema=schemas/agent.schema.json
# Agent model and role defaults are part of the application artifact.
default_model: claude:haiku:high
role_classify_timeout_ms: 1500
reply_history_limit: 20
# Default monthly subscription plan prices in micro-USD per provider (ticket 1215).
# Weekly value for quota share = monthly_usd_micros * 12 / 52.
# Users can override or null out entries via ~/.harnez/config.yaml under agent.plan_prices.
plan_prices:
  codex:
    plan: "Plus"
    monthly_usd_micros: 20000000
  claude:
    plan: "Max 5x"
    monthly_usd_micros: 100000000
  agy:
    plan: "Pro"
    monthly_usd_micros: 20000000
# Context tokens (last call's full input) above which harnez agent compacts a
# session before the next prompt; model-specific values take precedence over global values,
# and user configuration takes precedence over the spec at the same specificity.
compact_threshold_tokens: 200000
cost_check:
  cached_to_new_ratio: 20
  context_usage_fraction: 0.75
  min_turns: 3
compact_thresholds:
  codex:gpt-6.1-terra: 200000
  codex:gpt-6.2-sol: 200000
  codex:gpt-6-luna: 100000
  claude:haiku:low: 80000
  claude:haiku:med: 80000
  claude:haiku:high: 80000
  claude:haiku:xhigh: 80000
  strata-coder:qwen3.8-flash-next-coder-iq1_m: 80000
  strata:qwen3.8-flash-next-iq2_xs: 80000
  strata:qwen3.8-flash-next-iq3_xxs: 80000
# Tool calls allowed per agent turn (issue 1033); 0 = off. Model keys use the
# compact_thresholds lookup (spec, provider:name, provider); each entry maps a
# role, or "default", to its limit.
tool_call_limits:
  default: 0
  models:
    lmcoder:coder: {default: 40, advisor: 15, reviewer: 15}
  native_backstop_calls: 20
  synthesis_prompt: "Tool-call limit reached. No more tools are available. Answer now with what you have, and say what you could not check."
# Pi compaction overrides that `harnez apply` writes into Pi's settings.json for
# each model in Pi's models.json whose contextWindow is below the threshold
# (issue 1023). Pi's defaults (16384 reserve, 20000 kept) do not fit a 32k window.
pi_compaction:
  small_window_threshold_tokens: 65536
  reserve_fraction: 0.4
  keep_recent_fraction: 0.25
# Selectable context modes for agent runs starting with Pi (issue 1027).
context_modes:
  default:
    description: Default context with all discovered skills, context files, MCP servers, and default tools.
    skills: true
    mcp: true
    context_files: true
  no-skills:
    description: Rules, context files and tools enabled, but skills and MCP disabled.
    skills: false
    mcp: false
    context_files: true
  plain:
    description: Minimal context without skills, rules, context files, or MCP; restricted to standard review tools.
    skills: false
    mcp: false
    context_files: false
    tools: [read, edit, write, grep, find, bash]
# Manual compaction requires a verified context drop; Codex compacts natively.
# Agy lacks a reliable context count (issues 644 and 869).
auto_compact:
  default_mode: manual
  # lmcoder (served through Pi) is not listed: no verified context drop or native
  # compaction exists for the local model yet, so it keeps the manual default.
  provider_modes: {claude: manual, codex: native, agy: disabled, jules: disabled}
  watchdog_grace_ms: 20000
  # Legacy growth telemetry; dispatch uses full-context thresholds above.
  legacy_growth_threshold_tokens: 100000
  codex_on_demand_limit_tokens: 50000
  codex_status_prompt: "summarise your known status in one line"
model_probe_budget:
  max_calls_per_update: 20
  max_output_tokens_per_call: 16
  timeout_seconds: 30
stop:
  grace_ms: 1000
  kill_wait_ms: 2000
  poll_ms: 25
selftest:
  background_duration_ms: 30000

# Provider CLI stderr lines (line prefixes) that mean the session to resume is
# gone; harnez tui and agent resume then start a fresh session with a note.
# Only CLI-verified lines belong here: a provider without entries never
# restarts fresh, its resume errors stay errors (issue 791).
stale_session_errors:
  claude: ["No conversation found with session ID"]
  codex: ["Error: thread/resume: thread/resume failed: no rollout found for thread id"]

# Fixed provider error text and one check that can establish whether it still holds.
known_error_checks:
  - provider: agy
    match_text: Individual quota reached
    check: quota_available
    warning: agy reported an earlier quota error; quota is available now

resume_note:
  idle_threshold: 30m
  text: "This is a resumed session; do not report earlier errors (quota, 503) as current unless they recur in this turn."

# External session discovery reads Codex CLI rollout metadata only. Rollout files
# are JSONL; only the first session_meta record is needed for identity and cwd.
external_sessions:
  codex:
    root: "{home}/.codex/sessions"
    pattern: "*/*/*/rollout-*.jsonl"
    format: jsonl
    record_type_path: type
    record_type: session_meta
    max_record_bytes: 1048576
    active_match_window_seconds: 120
    name_prefix: codex
    available_status: available
    interactive_sources: [cli, vscode]
    fields:
      id: payload.id
      provider_session_id: payload.session_id
      working_dir: payload.cwd
      model_provider: payload.model_provider
      source: payload.source
      created_at: payload.timestamp

# Listing guidance for `harnez agent models` (legend printed below the table):
#   cost   owner-guided relative cost estimate by effort tier, anchored at codex:luna:low = 1
#   eff    tokens needed to reach a goal: + few, ~ average, - many, ? unmeasured
#   skills Go/TUI/SQL: + strong, ~ ok, - weak, ? no data
#   use    when to pick it; use_med replaces use for the :med variant
#   roles  roles the model is suggested for; a recommendation shown here, not enforced.
#          Spawn rights come from roles.<role>.spawns below.
# Evidence: docs/Models.md.
costly_models:
  - codex:sol:high
  - agy:argon:high
  - agy:neon:high
  - agy:neon:xhigh
  - "codex:astra:*"
  - claude:fable:high

models_legend: "COST is an owner-guided relative estimate by effort tier; codex:luna:low = 1 · EFF tokens per goal: + few ~ avg - many · skills: + strong ~ ok - weak · ? = no data"
model_traits:
  lean: Efficient standard work.
  std: Standard work.
  smart: Difficult judgment.
  tui: Terminal interfaces.
  gui: Graphical interfaces.
  cheap: Low-cost work.
  fast: Fast work.
  best: Hardest judgment, highest cost.
models:
  codex:luna:
    aliases: [luna, luna:low]
    preferred: true
    provider: codex
    name: gpt-6-luna
    tier: low
    roles: developer, mechanical, reviewer
    cost: 1
    cost_by_tier: {med: 5, high: 6}
    eff: "~"
    skills: Go~ TUI- SQL?
    use: Owner guidance — lowest OpenAI rung and the only GPT-6 model usable without an OpenAI subscription; background and mechanical work, including log compaction. luna:high only without a subscription; with one, step up to terra:low.
    use_med: Owner guidance — lowest OpenAI rung, also without a subscription; low-cost developer option for well-specified implementation and tests.
  codex:sol:
    aliases: [sol, sol:med]
    preferred: true
    provider: codex
    name: gpt-6.2-sol
    tier: med
    roles: developer, advisor, reviewer
    cost: 17
    cost_by_tier: {med: 25, high: 33}
    eff: "+"
    skills: Go+ TUI+ SQL?
    use: Owner guidance — needs an OpenAI subscription. GPT-6.2 Sol is the new frontier at OK cost (benchmarks); ladder sol:low, sol:med, sol:high; xhigh and max add little intelligence for their cost. sol:low supersedes terra:med and above and may be very cost-effective (high intelligence, low token output, low cost); untested.
  codex:terra:
    aliases: [terra, terra:low]
    preferred: true
    provider: codex
    name: gpt-6.1-terra
    tier: low
    roles: developer, advisor, reviewer
    cost: 15
    cost_by_tier: {med: 24, high: 36}
    eff: "?"
    skills: Go? TUI? SQL?
    use: Owner guidance — needs an OpenAI subscription. terra:low is the step after luna:med, at haiku:high level; sol:low supersedes terra:med and above. Cost not yet recalibrated (no FrontierCode 2.0 row, issue 1243).
  codex:astra:
    aliases: [astra, astra:low]
    preferred: true
    provider: codex
    name: gpt-6.2-astra
    tier: low
    roles: advisor, developer
    cost: 182
    cost_by_tier: {med: 342, high: 384}
    eff: "?"
    skills: Go+ TUI~ SQL~
    use: hardest multi-step coding and terminal automation; escalation only
  claude:haiku:
    aliases: [haiku, haiku:med]
    preferred: true
    provider: claude
    name: claude-haiku-5-5
    tier: med
    roles: developer, reviewer, mechanical, advisor
    cost: 4
    cost_by_tier: {med: 5, high: 7, xhigh: 12}
    extra_tiers: [xhigh]
    eff: "+"
    skills: Go~ TUI~ SQL~
    use: Owner guidance — haiku:low for very cheap, fast, simple work; haiku:high as a capable developer; skip haiku:med. haiku:xhigh is the next step for standard work; it matches opus:low at about a quarter of its API cost. Haiku's subscription subsidy is said to be lower than for larger models, so opus:high may pay off sooner. A weak host session; it needs more guidance than opus. Haiku 5.5 input above 100k tokens costs 5x; harnez compacts Haiku at 80k by default; override via agent.compact_thresholds (issue 969, docs/AutoCompaction.md). High thinking effort fills that budget quickly; see guidance_source_url.
    guidance_source_url: https://code.claude.com/docs/en/model-config#haiku-55-context-window-and-pricing
  claude:sonnet:
    aliases: [sonnet, sonnet:med]
    preferred: true
    provider: claude
    name: sonnet
    tier: med
    roles: advisor, reviewer, developer
    cost: 19
    cost_by_tier: {med: 24, high: 54}
    eff: "~"
    skills: Go~ TUI~ SQL~
    use: cross-vendor advisor or reviewer; strong tool use
  claude:fable:
    aliases: [fable]
    provider: claude
    name: claude-fable-5-2
    tier: med
    roles: orchestrator, reviewer
    cost: 131
    cost_by_tier: {med: 155, high: 420}
    eff: "?"
    skills: Go? TUI? SQL?
    use: "Owner guidance — fable:med is the top Anthropic rung. Cost from FrontierCode 2.0 rollouts (Fable 5.2 low $2.62, high $8.40), about 3.5x Opus 5.5 at low; issue 1243."
  claude:opus:
    aliases: [opus, opus:med]
    preferred: true
    provider: claude
    name: opus
    tier: med
    roles: orchestrator, reviewer
    cost: 38
    cost_by_tier: {med: 85, high: 121}
    eff: "+"
    skills: Go+ TUI? SQL+
    use: Owner guidance — opus:high for reviews and judgment; opus:low is no better than haiku:xhigh at about four times its API cost. Host seat for repo judgment, pre-work, diff review.
  agy:flash37:
    aliases: [flash37, flash37:low]
    disabled: true
    provider: agy
    name: gemini-3.7-flash
    tier: low
    roles: advisor, reviewer
    cost: 4
    eff: "?"
    skills: Go~ TUI~ SQL~
    use: legacy Gemini 3.7 Flash; being phased out in favor of flash38
  agy:flash38:
    aliases: [flash38, flash38:low]
    preferred: true
    provider: agy
    name: gemini-3.8-flash
    tier: low
    roles: reviewer, advisor, developer
    cost: 4
    eff: "~"
    skills: Go~ TUI~ SQL~
    use: Owner guidance — superseded by hydrogen:low as the cheap, fast Google model; kept for routing and preprocessing wide-context inputs.
    use_med: Owner guidance — route and preprocess wide-context inputs.
  agy:argon:
    aliases: [argon, argon:high]
    provider: agy
    name: gemini-4-argon
    tier: high
    roles: reviewer, advisor
    cost: 199
    cost_by_tier: {med: 285, high: 326}
    eff: "-"
    skills: Go? TUI? SQL?
    use: Owner guidance — on a separate plan, so spend its quota on argon:high as reviewer, advisor or consultant; skip argon:med. Not an orchestrator; the Gemini orchestrator variants think long and slow. Quota measured at low effort only (issue 822); FrontierCode 2.0 27.6% at high for $6.51 is behind Gemini 4 Neon (46.2% at $4.38), issue 1243.
  agy:hydrogen:
    aliases: [hydrogen, hydrogen:med]
    provider: agy
    name: gemini-4-hydrogen
    tier: med
    roles: advisor, reviewer, developer
    cost: 18
    cost_by_tier: {med: 45, high: 120}
    eff: "+"
    skills: Go? TUI? SQL?
    use: Owner guidance — hydrogen:low is the cheap, fast Google model and replaces flash38. hydrogen:med is an alternative to neon:low only if Hydrogen's subscription subsidy is better (unknown); neon:med is well above hydrogen:high. Costs from FrontierCode 2.0 low/med/high rollouts (issue 1243); no xhigh row used.
  agy:neon:
    aliases: [neon, neon:med]
    provider: agy
    name: gemini-4-neon
    tier: med
    roles: advisor, reviewer, developer
    cost: 48
    cost_by_tier: {med: 109, high: 219, xhigh: 384}
    extra_tiers: [xhigh]
    eff: "+"
    skills: Go? TUI? SQL?
    use: Owner guidance — Google ladder after hydrogen:low is neon:low, neon:med, neon:high; nothing above neon:high. Ranked 3rd on FrontierCode 2.0 (46.2% at high, $4.38/rollout). Costs are FrontierCode 2.0 rollout cost at luna:low = 1 ($0.02); issue 1243.
  agy:sonnet:
    provider: agy
    name: claude-sonnet-5-5
    tier: low
    effort: false
    roles: reviewer
    cost: 19
    eff: "?"
    skills: Go~ TUI~ SQL~
    use: Claude Sonnet 5.5; reviewer when Claude quota is out
  agy:opus:
    provider: agy
    name: claude-opus-5-5
    tier: low
    effort: false
    roles: advisor, reviewer
    cost: 38
    eff: "?"
    skills: Go+ TUI~ SQL~
    use: Claude Opus 5.5; careful analysis of hard problems
  lmcoder:coder:
    provider: lmcoder
    name: coder
    tier: low
    effort: false
    use: Local coder model served by the local lmcoder proxy; the first call waits while the model loads.
  strata-coder:qwen3.8-flash-next-coder-iq1_m:
    aliases: [strata]
    provider: strata-coder
    name: qwen3.8-flash-next-coder-iq1_m
    tier: low
    effort: false
    use: Local Strata coder model served through Pi provider strata-coder; requires that provider and this exact model ID in ~/.pi/agent/models.json.
  strata:qwen3.8-flash-next-iq2_xs:
    aliases: [strata-iq2]
    provider: strata
    name: qwen3.8-flash-next-iq2_xs
    tier: low
    effort: false
    use: Local Strata IQ2 XS model served through Pi provider strata; requires that provider and this exact model ID in ~/.pi/agent/models.json. Its configured context window is 98304 tokens; Harnez compacts at 80000.
  strata:qwen3.8-flash-next-iq3_xxs:
    aliases: [strata-iq3]
    provider: strata
    name: qwen3.8-flash-next-iq3_xxs
    tier: low
    effort: false
    use: Local Strata IQ3 XXS model served through Pi provider strata; requires that provider and this exact model ID in ~/.pi/agent/models.json. Its configured context window is 98304 tokens; Harnez compacts at 80000.
  jules:jules:
    aliases: [jules]
    disabled: true
    provider: jules
    name: jules
    tier: low
    effort: false
    roles: developer
    use: Google Jules cloud agent on a connected GitHub repo; delivers a GitHub PR. Google shuts it down on 2026-12-31 and sessions end on 2026-11-11.

# Google Jules REST API (issue 1071). config_path holds the API key and must not
# be readable by other users. A wait that runs out leaves the session running, so
# keep wait_timeout_ms under the 30-minute limit on Claude Code background jobs.
jules:
  base_url: https://jules.googleapis.com/v1alpha
  config_path: ~/.jules/config.json
  poll_interval_ms: 30000
  wait_timeout_ms: 1500000
  request_timeout_ms: 30000
  max_poll_errors: 5
  completed_pr_polls: 3
# Before a session starts on sync_branch, the GitHub copy is fast-forwarded to
# sync_remote's commit (issue 1074). A failed or diverged sync only warns.
  sync_remote: origin
  sync_branch: main
  sync_timeout_ms: 60000
# Sent once per session when Jules first stops to ask (issue 1113: 6 of 12 runs
# asked back despite the prompt). Empty turns it off.
  auto_reply: "Nobody will answer questions. Pick the smallest option that keeps your task's rules, state which one you picked, then finish and submit the PR now. Do not ask again."

# Optional per-provider preamble text appended to the start protocol (issue 1217).
preambles:
  claude: "Claude family note: inspect targeted line ranges, prefer minimal edits, and report only verified file paths and test outputs."
  codex: "Codex family note: verify command and test outputs directly before finishing, and state observed results without extrapolating."
  agy: "Gemini/agy family note: inspect exact files in bounded ranges before editing, and ground every claim in direct tool output."

# Roles keep delegation one level deep. `spawns` lists the roles a session of
# that role may start through `harnez agent`; an empty list makes it a leaf
# worker that harnez refuses to let start, resume or manage other agents.
# `rules` is added to the protocol preamble of every turn of that role.
# A session started without --role gets default_role.
default_role: developer
roles:
  orchestrator:
    description: Coordinate work and delegate to leaf workers.
    aliases: [lead, coordinator]
    spawns: [developer, reviewer, advisor]
    rules: >-
      You coordinate; you never write code or edit files yourself. The host
      repository's applications are your sole product; never volunteer or offer
      work in external repositories. Delegate each piece of work to a helper with
      `harnez agent start --name <n> --role <developer|reviewer|advisor> --model <m> -d <dir> --stream stats "<task>"`
      and continue it with `harnez agent resume --name <n> --stream stats "<follow-up>"`.
      Every call blocks until the helper's turn is done: wait for it, never poll,
      and never start the same call twice.
      Use one developer at a time (one writer). Never start an orchestrator and
      never hand the whole sprint to another agent. Ticket files are the message
      channel; prompts stay short. Delete every helper when you are done
      (`harnez agent delete --name <n>`).
      If resuming a helper fails, write the follow-up into the ticket and start a fresh helper instead of retrying.
      When codex has no quota, use agy:neon:med (or agy:argon:high on its separate plan) as the cross-vendor reviewer.
  developer:
    description: Implement assigned work, run checks, and commit the result.
    aliases: [dev, coder, worker, implementer]
    default_model: lean
    models:
      lean: [terra:low, luna:high, haiku:high, neon:low]
      std: [sol:low, luna:high, haiku:xhigh, neon:low]
      smart: [sol:med, opus:high, neon:med]
      tui: [lean]
      gui: [lean, std]
      cheap: [luna:med, haiku:low, hydrogen:low]
      fast: [haiku:low, luna:med, hydrogen:low]
    spawns: []
    rules: >-
      You are a leaf worker. The host repository's applications are your sole product;
      never volunteer or offer work in external repositories. Do the assigned ticket
      or milestone yourself: read, edit, test and commit. Never start native
      subagents, background agents or delegating skills. Your own session is
      $HARNEZ_SESSION_ID and harnez process $HARNEZ_AGENT_LAUNCHER_PID launched you:
      when checking for concurrent agents, exclude that session and that process tree.
      Report in at most 10 lines: files changed, tests run and their result, open problems.
  reviewer:
    description: Inspect changes and report actionable findings without editing.
    aliases: [review, critic, checker]
    default_model: smart
    models:
      cheap: [haiku:low, luna:med, hydrogen:low]
      lean: [terra:low, luna:high, neon:low, haiku:high]
      smart: [sol:med, neon:med, opus:high]
      best: [sol:high, neon:high, argon:high, fable:med]
    spawns: []
    auto_approve_tools: true
    rules: >-
      You are a leaf, read-only reviewer. Inspect the diff and test output you
      are given; never edit files and never run `harnez agent`. Outside this
      repository, only read for context or file a requested/blocking issue. Report
      findings by severity in at most 15 lines.
  advisor:
    description: Research the code and return a concise read-only plan.
    aliases: [search, searcher, arch, explorer, scout, auditor, planner]
    default_model: cheap
    models:
      cheap: [luna:med, haiku:low, hydrogen:low]
      lean: [terra:low, luna:high, neon:low, haiku:high]
      smart: [opus:high, neon:med, argon:high, sol:med]
    spawns: []
    auto_approve_tools: true
    rules: >-
      You are a leaf, read-only advisor. Audit the ticket and code paths you are
      given and return a short implementation plan; never edit code and never run
      `harnez agent`. Outside this repository, only read for context or file a
      requested/blocking issue. Report in at most 15 lines.
