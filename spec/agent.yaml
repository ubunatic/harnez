# yaml-language-server: $schema=schemas/agent.schema.json
# Agent model and role defaults are part of the application artifact.
default_model: codex:luna:low

# `roles` and `use` are shown by `harnez agent models`; `use_med` replaces `use`
# for the model's :med variant. Guidance source: docs/practices/ModelRoles.md.
models:
  codex:luna:
    provider: codex
    name: gpt-6-luna
    tier: low
    roles: developer, mechanical
    use: clear, bounded tickets; cheapest; weak on long terminal loops
    use_med: interface or design changes; less prone to bending tests
  codex:sol:
    provider: codex
    name: gpt-6-sol
    tier: low
    roles: developer, advisor, reviewer
    use: capable coding and tool use below Astra cost; milestone reviewer
  codex:astra:
    provider: codex
    name: gpt-5.6-astra
    tier: low
    roles: advisor, developer
    use: hardest multi-step coding and terminal automation; flagship cost
  codex:terra:
    provider: codex
    name: gpt-5.6-terra
    tier: low
    roles: advisor, reviewer, developer
    use: best-value auditor; finds code-level traps with file:line
  claude:haiku:
    provider: claude
    name: haiku
    tier: low
    roles: mechanical
    use: narrow edits with a machine-checkable acceptance test only
  claude:sonnet:
    provider: claude
    name: sonnet
    tier: low
    roles: advisor, reviewer, developer
    use: cross-vendor advisor or reviewer; strong tool use at mid cost
  claude:opus:
    provider: claude
    name: opus
    tier: low
    roles: orchestrator, reviewer
    use: host seat; complex repo judgment, pre-work and diff review
  agy:flash37:
    provider: agy
    name: gemini-3.7-flash
    tier: low
    roles: developer, advisor, reviewer
    use: fast bounded implementation or review with clear checks
  agy:flash38:
    provider: agy
    name: gemini-3.8-flash
    tier: low
    roles: reviewer, advisor, developer
    use: cross-vendor reviewer; strong terminal coding, slow first token
    use_med: escalation advisor on a budget
  agy:sonnet:
    provider: agy
    name: claude-sonnet-4-6
    tier: low
    effort: false
    roles: reviewer, developer
    use: Sonnet 4.6 via agy; reviewer or developer when Claude quota is out
  agy:opus:
    provider: agy
    name: claude-opus-4-6-thinking
    tier: low
    effort: false
    roles: advisor, reviewer
    use: Opus 4.6 via agy; careful analysis of hard problems

# Roles keep delegation one level deep. `spawns` lists the roles a session of
# that role may start through `harnez agent`; an empty list makes it a leaf
# worker that harnez refuses to let start, resume or manage other agents.
# `rules` is added to the protocol preamble of every turn of that role.
# A session started without --role gets default_role.
default_role: developer
roles:
  orchestrator:
    spawns: [developer, reviewer, advisor]
    rules: >-
      You coordinate; you never write code or edit files yourself. Delegate each
      piece of work to a helper with
      `harnez agent start --name <n> --role <developer|reviewer|advisor> --model <m> -d <dir> --stream stats "<task>"`
      and continue it with `harnez agent resume --name <n> --stream stats "<follow-up>"`.
      Every call blocks until the helper's turn is done: wait for it, never poll,
      and never start the same call twice.
      Use one developer at a time (one writer). Never start an orchestrator and
      never hand the whole sprint to another agent. Ticket files are the message
      channel; prompts stay short. Delete every helper when you are done
      (`harnez agent delete --name <n>`).
      If resuming a helper fails, write the follow-up into the ticket and start a fresh helper instead of retrying.
      When codex has no quota, use agy:flash38 as the cross-vendor reviewer.
  developer:
    spawns: []
    rules: >-
      You are a leaf worker. Do the assigned ticket or milestone yourself: read,
      edit, test and commit. Never run `harnez agent` and never start native
      subagents, background agents or delegating skills. Report in at most 10
      lines: files changed, tests run and their result, open problems.
  reviewer:
    spawns: []
    rules: >-
      You are a leaf, read-only reviewer. Inspect the diff and test output you
      are given; never edit files and never run `harnez agent`. Report findings
      by severity in at most 15 lines.
  advisor:
    spawns: []
    rules: >-
      You are a leaf, read-only advisor. Audit the ticket and code paths you are
      given and return a short implementation plan; never edit code and never run
      `harnez agent`. Report in at most 15 lines.
