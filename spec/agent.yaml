# yaml-language-server: $schema=schemas/agent.schema.json
# Agent model and role defaults are part of the application artifact.
default_model: codex:luna:low

# Listing guidance for `harnez agent models` (legend printed below the table):
#   cost   price level 1-9, each step ~2x the previous, luna = 1 (list price and
#          subscription feel; vendors have separate quota pools)
#   eff    tokens needed to reach a goal: + few, ~ average, - many, ? unmeasured
#   skills Go/TUI/SQL: + strong, ~ ok, - weak, ? no data
#   use    when to pick it; use_med replaces use for the :med variant
# Evidence: docs/Models.md.
models_legend: "COST 1-9, each step ~2x (luna=1) · EFF tokens per goal: + few ~ avg - many · skills: + strong ~ ok - weak · ? = no data"
models:
  codex:luna:
    provider: codex
    name: gpt-6-luna
    tier: low
    roles: developer, mechanical
    cost: 1
    eff: "~"
    skills: Go~ TUI- SQL?
    use: clear bounded tickets; try first, weak on long terminal loops
    use_med: interface or design changes; less prone to bending tests
  codex:sol:
    provider: codex
    name: gpt-6-sol
    tier: low
    roles: developer, advisor, reviewer
    cost: 6
    eff: "-"
    skills: Go~ TUI~ SQL?
    use: capable coding and tool use; milestone reviewer; tends to over-refactor
  codex:astra:
    provider: codex
    name: gpt-6-astra
    tier: low
    roles: advisor, developer
    cost: 8
    eff: "?"
    skills: Go+ TUI~ SQL~
    use: hardest multi-step coding and terminal automation; escalation only
  codex:terra:
    provider: codex
    name: gpt-5.6-terra
    tier: low
    roles: advisor, reviewer, developer
    cost: 5
    eff: "+"
    skills: Go~ TUI~ SQL~
    use: best-value auditor; finds code traps with file:line
  claude:haiku:
    provider: claude
    name: haiku
    tier: low
    roles: mechanical
    cost: 3
    eff: "-"
    skills: Go~ TUI- SQL~
    use: narrow edits with a machine-checkable test only
  claude:sonnet:
    provider: claude
    name: sonnet
    tier: low
    roles: advisor, reviewer, developer
    cost: 5
    eff: "~"
    skills: Go~ TUI~ SQL~
    use: cross-vendor advisor or reviewer; strong tool use
  claude:opus:
    provider: claude
    name: opus
    tier: low
    roles: orchestrator, reviewer
    cost: 6
    eff: "+"
