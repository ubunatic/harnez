#          of the 5h window on ChatGPT Plus, Claude Pro, Google Pro)
#   eff    tokens needed to reach a goal: + few, ~ average, - many, ? unmeasured
#   skills Go/TUI/SQL: + strong, ~ ok, - weak, ? no data
#   use    when to pick it; use_med replaces use for the :med variant
# Evidence: docs/Models.md.
models_legend: "COST × luna (luna=1, astra=100) · EFF tokens per goal: + few ~ avg - many · skills: + strong ~ ok - weak · ? = no data"
models:
  codex:luna:
    aliases: [luna, luna:low]
    preferred: true
    provider: codex
    name: gpt-6-luna
    tier: low
    roles: developer, mechanical
    cost: 1
    eff: "~"
    skills: Go~ TUI- SQL?
    use: clear bounded tickets; try first, weak on long terminal loops
    use_med: interface or design changes; less prone to bending tests
