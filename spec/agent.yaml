# yaml-language-server: $schema=schemas/agent.schema.json
# Agent model and role defaults are part of the application artifact.
default_model: codex:luna:high
role_classify_timeout_ms: 1500
reply_history_limit: 20
# Context tokens (last call's full input) above which harnez agent compacts a
# session before the next prompt; model-specific values take precedence over global values,
# and user configuration takes precedence over the spec at the same specificity.
compact_threshold_tokens: 200000
compact_thresholds:
  codex:gpt-6.1-terra: 100000
  codex:gpt-6.1-sol: 100000
  codex:gpt-6-luna: 100000
  claude:haiku:low: 80000
  claude:haiku:med: 80000
  claude:haiku:high: 80000
# Pi compaction overrides that `harnez apply` writes into Pi's settings.json for
# each model in Pi's models.json whose contextWindow is below the threshold
# (issue 1023). Pi's defaults (16384 reserve, 20000 kept) do not fit a 32k window.
pi_compaction:
  small_window_threshold_tokens: 65536
  reserve_fraction: 0.4
  keep_recent_fraction: 0.25
# Manual compaction requires a verified context drop; Codex compacts natively.
# Agy lacks a reliable context count (issues 644 and 869).
auto_compact:
  default_mode: manual
  # lmcoder (served through Pi) is not listed: no verified context drop or native
  # compaction exists for the local model yet, so it keeps the manual default.
  provider_modes: {claude: manual, codex: native, agy: disabled}
  watchdog_grace_ms: 20000
  # Legacy growth telemetry; dispatch uses full-context thresholds above.
  legacy_growth_threshold_tokens: 100000
  codex_on_demand_limit_tokens: 50000
  codex_status_prompt: "summarise your known status in one line"
model_probe_budget:
  max_calls_per_update: 20
  max_output_tokens_per_call: 16
  timeout_seconds: 30
stop:
  grace_ms: 1000
  kill_wait_ms: 2000
  poll_ms: 25
selftest:
  background_duration_ms: 30000

# Provider CLI stderr lines (line prefixes) that mean the session to resume is
# gone; harnez tui and agent resume then start a fresh session with a note.
# Only CLI-verified lines belong here: a provider without entries never
# restarts fresh, its resume errors stay errors (issue 791).
stale_session_errors:
  claude: ["No conversation found with session ID"]
  codex: ["Error: thread/resume: thread/resume failed: no rollout found for thread id"]

# Fixed provider error text and one check that can establish whether it still holds.
known_error_checks:
  - provider: agy
    match_text: Individual quota reached
    check: quota_available
    warning: agy reported an earlier quota error; quota is available now

resume_note:
  idle_threshold: 30m
  text: "This is a resumed session; do not report earlier errors (quota, 503) as current unless they recur in this turn."

# External session discovery reads Codex CLI rollout metadata only. Rollout files
# are JSONL; only the first session_meta record is needed for identity and cwd.
external_sessions:
  codex:
    root: "{home}/.codex/sessions"
    pattern: "*/*/*/rollout-*.jsonl"
    format: jsonl
    record_type_path: type
    record_type: session_meta
    max_record_bytes: 1048576
    active_match_window_seconds: 120
    name_prefix: codex
    available_status: available
    interactive_sources: [cli, vscode]
    fields:
      id: payload.id
      provider_session_id: payload.session_id
      working_dir: payload.cwd
      model_provider: payload.model_provider
      source: payload.source
      created_at: payload.timestamp

# Listing guidance for `harnez agent models` (legend printed below the table):
#   cost   owner-guided relative cost estimate by effort tier, anchored at codex:luna:low = 1
#   eff    tokens needed to reach a goal: + few, ~ average, - many, ? unmeasured
#   skills Go/TUI/SQL: + strong, ~ ok, - weak, ? no data
#   use    when to pick it; use_med replaces use for the :med variant
#   roles  roles the model is suggested for; a recommendation shown here, not enforced.
#          Spawn rights come from roles.<role>.spawns below.
# Evidence: docs/Models.md.
models_legend: "COST is an owner-guided relative estimate by effort tier; codex:luna:low = 1 · EFF tokens per goal: + few ~ avg - many · skills: + strong ~ ok - weak · ? = no data"
model_traits:
  lean: Efficient standard work.
  std: Standard work.
  smart: Difficult judgment.
  tui: Terminal interfaces.
  gui: Graphical interfaces.
  cheap: Low-cost work.
  fast: Fast work.
  ai: AI-oriented work.
models:
  codex:luna:
    aliases: [luna, luna:low]
    preferred: true
    provider: codex
    name: gpt-6-luna
    tier: low
    roles: developer, mechanical
    cost: 1
    cost_by_tier: {med: 4, high: 6}
    eff: "~"
    skills: Go~ TUI- SQL?
    use: Owner guidance — background and mechanical work, including log compaction.
    use_med: Owner guidance — low-cost developer option for well-specified implementation and tests.
  codex:sol:
    aliases: [sol, sol:low]
    preferred: true
    provider: codex
    name: gpt-6.1-sol
    tier: low
    roles: developer, advisor, reviewer
    cost: 29
    cost_by_tier: {med: 47, high: 71}
    eff: "~"
    skills: Go~ TUI~ SQL?
    use: Owner guidance — use sol:low for judgment, orchestration, and resolving compiler failures; reserve higher effort for harder work.
  codex:terra:
    aliases: [terra, terra:low]
    preferred: true
    provider: codex
    name: gpt-6.1-terra
    tier: low
    roles: developer, advisor, reviewer
    cost: 15
    cost_by_tier: {med: 24, high: 36}
    eff: "?"
    skills: Go? TUI? SQL?
    use: Near-Sol Codex developer and reviewer at half Sol's price; use Sol for the hardest judgment.
  codex:astra:
    aliases: [astra, astra:low]
    preferred: true
    provider: codex
    name: gpt-6-astra
    tier: low
    roles: advisor, developer
    cost: 182
    cost_by_tier: {med: 342, high: 384}
    eff: "?"
    skills: Go+ TUI~ SQL~
    use: hardest multi-step coding and terminal automation; escalation only
  claude:haiku:
    aliases: [haiku, haiku:low]
    preferred: true
    provider: claude
    name: claude-haiku-5-5
    tier: low
    roles: developer, reviewer, mechanical, advisor
    cost: 4
    cost_by_tier: {med: 4, high: 7}
    eff: "-"
    skills: Go~ TUI~ SQL~
    use: Owner guidance — haiku:med for easy tasks and haiku:low for very simple, repetitive tasks. Haiku 5.5 input above 100k tokens costs 5x; harnez compacts Haiku at 80k by default; override via agent.compact_thresholds (issue 969, docs/AutoCompaction.md). High thinking effort fills that budget quickly; see guidance_source_url.
    guidance_source_url: https://code.claude.com/docs/en/model-config#haiku-55-context-window-and-pricing
  claude:sonnet:
    aliases: [sonnet, sonnet:low]
    preferred: true
    provider: claude
    name: sonnet
    tier: low
    roles: advisor, reviewer, developer
    cost: 15
    eff: "~"
    skills: Go~ TUI~ SQL~
    use: cross-vendor advisor or reviewer; strong tool use
  claude:opus:
    aliases: [opus, opus:low]
    preferred: true
    provider: claude
    name: opus
    tier: low
    roles: orchestrator, reviewer
    cost: 20
    eff: "+"
    skills: Go+ TUI? SQL+
    use: host seat for repo judgment, pre-work, diff review
  agy:flash37:
    aliases: [flash37, flash37:low]
    provider: agy
    name: gemini-3.7-flash
    tier: low
    roles: advisor, reviewer
    cost: 4
    eff: "?"
    skills: Go~ TUI~ SQL~
    use: legacy Gemini 3.7 Flash; being phased out in favor of flash38
  agy:flash38:
    aliases: [flash38, flash38:low]
    preferred: true
    provider: agy
    name: gemini-3.8-flash
    tier: low
    roles: reviewer, advisor
    cost: 4
    eff: "~"
    skills: Go~ TUI~ SQL~
    use: Owner guidance — use flash38:med for routing and preprocessing, especially wide-context inputs.
    use_med: Owner guidance — route and preprocess wide-context inputs.
  agy:argon:
    aliases: [argon, argon:low]
    provider: agy
    name: gemini-4-argon
    tier: low
    roles: advisor, reviewer
    cost: 24
    eff: "?"
    skills: Go? TUI? SQL?
    use: premium Gemini 4 Argon; scarce weekly quota, measured at low effort only
  agy:sonnet:
    provider: agy
    name: claude-sonnet-5-5
    tier: low
    effort: false
    roles: reviewer
    cost: 16
    eff: "?"
    skills: Go~ TUI~ SQL~
    use: Claude Sonnet 5.5; reviewer when Claude quota is out
  agy:opus:
    provider: agy
    name: claude-opus-5-5
    tier: low
    effort: false
    roles: advisor, reviewer
    cost: 32
    eff: "?"
    skills: Go+ TUI~ SQL~
    use: Claude Opus 5.5; careful analysis of hard problems
  lmcoder:coder:
    provider: lmcoder
    name: coder
    tier: low
    effort: false
    use: Local coder model served by the local lmcoder proxy; the first call waits while the model loads.

# Roles keep delegation one level deep. `spawns` lists the roles a session of
# that role may start through `harnez agent`; an empty list makes it a leaf
# worker that harnez refuses to let start, resume or manage other agents.
# `rules` is added to the protocol preamble of every turn of that role.
# A session started without --role gets default_role.
default_role: developer
roles:
  orchestrator:
    description: Coordinate work and delegate to leaf workers.
    aliases: [lead, coordinator]
    spawns: [developer, reviewer, advisor]
    rules: >-
      You coordinate; you never write code or edit files yourself. The host
      repository's applications are your sole product; never volunteer or offer
      work in external repositories. Delegate each piece of work to a helper with
      `harnez agent start --name <n> --role <developer|reviewer|advisor> --model <m> -d <dir> --stream stats "<task>"`
      and continue it with `harnez agent resume --name <n> --stream stats "<follow-up>"`.
      Every call blocks until the helper's turn is done: wait for it, never poll,
      and never start the same call twice.
      Use one developer at a time (one writer). Never start an orchestrator and
      never hand the whole sprint to another agent. Ticket files are the message
      channel; prompts stay short. Delete every helper when you are done
      (`harnez agent delete --name <n>`).
      If resuming a helper fails, write the follow-up into the ticket and start a fresh helper instead of retrying.
      When codex has no quota, use agy:flash38 as the cross-vendor reviewer.
  developer:
    description: Implement assigned work, run checks, and commit the result.
    aliases: [dev, coder, worker, implementer]
    default_model: lean
    models:
      lean: [terra:low]
      std: [terra:med, opus:low]
      smart: [sol:med, opus:med]
      tui: [smart]
      gui: [lean, std]
      cheap: [luna:med]
      fast: [haiku:med]
      ai: []
    spawns: []
    rules: >-
      You are a leaf worker. The host repository's applications are your sole product;
      never volunteer or offer work in external repositories. Do the assigned ticket
      or milestone yourself: read, edit, test and commit. Never start native
      subagents, background agents or delegating skills. Report in at most 10
      lines: files changed, tests run and their result, open problems.
  reviewer:
    description: Inspect changes and report actionable findings without editing.
    aliases: [review, critic, checker]
    default_model: smart
    models: {smart: [sol:low]}
    spawns: []
    auto_approve_tools: true
    rules: >-
      You are a leaf, read-only reviewer. Inspect the diff and test output you
      are given; never edit files and never run `harnez agent`. Outside this
      repository, only read for context or file a requested/blocking issue. Report
      findings by severity in at most 15 lines.
  advisor:
    description: Research the code and return a concise read-only plan.
    aliases: [search, arch, explorer, scout, auditor, planner]
    default_model: cheap
    models: {cheap: [luna:low, haiku:low], smart: [opus:low, opus:med, sol:low]}
    spawns: []
    auto_approve_tools: true
    rules: >-
      You are a leaf, read-only advisor. Audit the ticket and code paths you are
      given and return a short implementation plan; never edit code and never run
      `harnez agent`. Outside this repository, only read for context or file a
      requested/blocking issue. Report in at most 15 lines.
