# yaml-language-server: $schema=schemas/pi-background-tasks.schema.json
# Bounds for the project-local Pi background-task extension (.pi/extensions/background-tasks.ts).
# This file is JSON-compatible YAML (one flow mapping, no anchors or tags) so the extension can load
# it strictly with JSON.parse and no YAML dependency. Keep it in that form; validate with the schema.
{
  "output_limit_chars": 16000,
  "finished_retention_limit": 50,
  "stop": {
    "grace_ms": 1000,
    "kill_wait_ms": 2000,
    "poll_ms": 25
  },
  "capture": {
    "enabled_by_default": false,
    "low_watermark_bytes": 262144,
    "high_watermark_bytes": 1048576,
    "hard_watermark_bytes": 2097152,
    "stall_ms": 30000,
    "finalize_ms": 30000,
    "cleanup_ms": 2000,
    "io_concurrency": 2
  },
  "delivery": {
    "hold_warn_ms": 30000,
    "flush_poll_ms": 25
  },
  "status": {
    "max_cells": 72,
    "reserved_cells": 16,
    "label_max_cells": 12,
    "fallback_label": "task",
    "manual_emoji": "👤",
    "default_emoji": "🤖",
    "label_emoji": {
      "build": "🔨",
      "test": "🧪",
      "tests": "🧪",
      "lint": "🧹",
      "deploy": "🚀",
      "release": "🚀",
      "install": "📦",
      "download": "📥",
      "backup": "💾",
      "docs": "📝"
    }
  }
}
