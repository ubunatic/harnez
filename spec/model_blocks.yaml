# yaml-language-server: $schema=schemas/model_blocks.schema.json
#
# Local model blocks (issue 1122). `harnez models block` and the auto-block on
# a known quota error write an expiring record; an active record makes
# CachedProviderQuotaAvailabilities report the model as exhausted.
#
# Used when a quota error names no reset time.
default_duration: 5h
# Quota-error patterns checked against a failed agent turn's driver error text
# (not the model's reply). `match` must be anchored at the start of that text
# (^) and spell the provider's own error shape, so an ordinary failure that
# merely mentions a quota phrase never blocks. `reset_in_regex` captures a span
# such as "3 hours 20 minutes" or "2h"; `reset_at_regex` captures an RFC3339
# time. The first capture group is used; the reset time is optional.
patterns:
  # agyRunError / decodeAgy wrap agy's {"error": "..."} field; fixture:
  # internal/subagent/testdata/agy_quota_error.json
  - provider: agy
    match: '(?i)^(?:agy(?: resume| compact)?: |agy reported status "[A-Z_]+": )RESOURCE_EXHAUSTED \(code 429\): Individual quota reached'
    reset_in_regex: '(?i)resets? in ([0-9a-z ,]+)'
    reset_at_regex: '(?i)resets? at (\d{4}-\d{2}-\d{2}T[0-9:.+Zz-]+)'
  # codexTurnFailure wraps the message of a Codex "error" event. The reset
  # wording is unverified against live provider output (issue 1122).
  - provider: codex
    match: '(?i)^codex turn failed: you.ve hit your usage limit'
    reset_in_regex: '(?i)try again in ([0-9a-z ,]+)'
    reset_at_regex: '(?i)try again at (\d{4}-\d{2}-\d{2}T[0-9:.+Zz-]+)'
