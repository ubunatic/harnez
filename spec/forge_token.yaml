# yaml-language-server: $schema=schemas/forge_token.schema.json
# Settings for `harnez forge token`: the scopes of the read-only Forgejo token it creates, the
# token name prefix (name = <prefix>-<host>-<YYYYMMDD-HHMM>), the keyring service for
# secret-tool, the fallback directory under the harnez config dir (files are 0600), and the
# host used when --host is not given (must be a forgejo host in spec/pr.yaml). Issue 1118.
default_host: codeberg.org
scopes: [read:repository, read:issue]
name_prefix: harnez-read
keyring_service: harnez-forge-token
token_dir: forge-tokens
