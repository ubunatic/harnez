# yaml-language-server: $schema=schemas/colors.schema.json
#
# Named ANSI SGR color codes for `harnez usage --watch` (issue 136). This is
# the single source of truth for terminal color values rograph's
# background-highlighted bars and sparklines use (RenderBar/RenderSparkline's
# ANSI option) -- Go code must resolve these values from here rather than
# hardcoding SGR literals that duplicate them. See docs/Spec.md.
#
# sgr is one or more semicolon-separated SGR parameter codes, applied as
# "\x1b[<sgr>m...\x1b[0m".
colors:
  background:
    title: "Terminal-native background"
    description: "Default transparent/native terminal background selected by indicators.yaml (no forced ANSI SGR)"
  panel-bg:
    title: "Panel background"
    description: "Shared black chart field selected by indicators.yaml"
    sgr: "40"
  chart-cool:
    title: "Chart cool"
    description: "0–25% load-history and current percentage foreground"
    sgr: "34"
  chart-green:
    title: "Chart green"
    description: ">25–50% load-history and current percentage foreground"
    sgr: "32"
  chart-yellow:
    title: "Chart yellow"
    description: ">50–75% load-history and current percentage foreground"
    sgr: "33"
  chart-warm:
    title: "Chart warm"
    description: ">75–100% load-history and current percentage foreground"
    sgr: "31"
  time-gauge-fg:
    title: "Debug time gauge foreground"
    sgr: "40"
  time-gauge-bg:
    title: "Debug time gauge background"
  bold:
    title: "Bold"
    sgr: "1"
  dim-grey:
    title: "Dim (grey foreground)"
    sgr: "90"
  dim-faint:
    title: "Dim (faint attribute)"
    sgr: "2"
