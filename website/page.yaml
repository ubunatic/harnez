title: harnez — declarative developer and agent harness
kicker: Agent configuration · Session isolation · Live quotas · Tool telemetry
title_lead: harnez
title_main: manage agent harnesses from one config.yaml.
lead: Configure Claude Code, Antigravity, Codex, and Pi declaratively. Idempotent setup, isolated
  runner sessions, two-stage command truncation and Quota-1 hooks, forge-tracked issues, live quota
  and hardware monitoring, and SQLite tool telemetry keep multi-agent workflows observable and safe.
go_package: true
install: go install ubunatic.com/harnez/cmd/harnez@latest
logo:
  src: assets/logo.svg
  alt: harnez terminal prompt logo
cta_primary:
  label: See the dashboard
  href: '#usage'
cta_secondary:
  label: View source
  href: https://codeberg.org/ubunatic/harnez
sections:
- id: story
  tag: Why harnez
  title: Why harnez?
  blocks:
  - cards:
    - title: Configuration Drift & Context Bloat
      text: AI coding agent setups drift across machines and providers. Tool permissions wipe on updates,
        conventions diverge across repositories, runaway shell output overflows context windows, and
        multi-agent runs collide on shared sockets, state files, or redundant test runs.
    - title: Declarative Source of Truth & Bounded Hooks
      text: One declarative `config.yaml` and per-repo `.harnez/repo.yaml` idempotently manage global
        configs, AGit git setup, and copyable docs. Two-stage `PreToolUse` hooks wrap execution in
        `harnez exec` with spec-driven spill-file truncation, Quota-1 test budgets, and SQLite telemetry.
    - title: Isolated, Multi-Provider Engineering
      text: Launch and monitor subagents across Claude Code, Codex, Antigravity, and Pi with role-based
        model picks, Landlock/bwrap session isolation (`$TAIA_SESSION_DIR`), staged host binary promotion,
        and unified local or Codeberg/GitHub issue workflows.
- id: usage
  tag: Unified Token, Quota & Hardware Dashboard
  title: Unified Token, Quota & Hardware Dashboard
  blocks:
  - gallery:
    - caption: harnez usage --watch
      images:
      - src: assets/usage-dashboard.png
        alt: harnez usage live terminal dashboard showing All Usage, CPU/RAM/GPU load, Mic level meter,
          and Remote Load streaming
  - gallery:
    - caption: Quota windows next to local and remote hardware load (CPU, RAM, swap, GPU, VRAM).
      images:
      - src: assets/usage-load.png
        alt: harnez usage showing All Usage quota bars for five providers, local Load with CPU at 100
          percent and RAM at 83 percent, and Remote Load of an ssh node with two GPUs
    - caption: A local vision workload on the remote node's RTX 3060 and Phoenix1 iGPU, watched over ssh.
      images:
      - src: assets/usage-load-rtx.png
        alt: harnez usage Remote Load panel for node x600 showing the RTX 3060 at 53 percent and the Phoenix1
          GPU at 59 percent while a vision workload runs
  - text: |-
      `harnez usage` (aliases: `quota`, `tokens`) unifies live rate-limit quota windows, token velocity sparklines, host hardware load, remote SSH nodes, and microphone speech meters into one interactive btop-style dashboard backed by the `harnez server` collector.

      **Instant Splash Status:** Red/green brand glyphs (`● codex`, `✱ claude`, `Λ agy`, `● mic`) verify provider connectivity and recording state at startup, and the CLI automatically hands over stale collector daemons on version mismatch.

      ### Multi-Provider Quotas

      Live 5-hour, weekly, monthly, and scoped quotas (including separate Claude Code Fable weekly tracking) across Claude Code, Antigravity (AGY), and OpenAI Codex with collector-backed file-locked caching and runner broker reads.

      ### Hardware & Remote Streaming

      Local CPU, RAM, and GPU/VRAM telemetry (AMD Cezanne/Phoenix, NVIDIA) alongside remote node metrics streamed over SSH (`--host user@x600`), plus terminal size probing via `TIOCGWINSZ` so agent subprocesses can inspect usage safely.

      ### Live Speech & Mic Ballistics

      PipeWire (`pw-record`), ALSA (`arecord`), and PulseAudio live input capture with logarithmic dBFS scaling and equalizer-style visual decay.

      ```
      # live btop-style dashboard with tokens/min sparkline and hardware load
      $ harnez usage --watch          # -w

      # one-shot quota table or compact load + usage panels
      $ harnez usage --table
      $ harnez usage --compact

      # stream live telemetry from a remote compute node over SSH
      $ harnez usage --watch --host user@x600

      # inspect JSON output for custom statuslines or automation
      $ harnez usage --json
      ```
- id: telemetry
  tag: Tool Telemetry & Analytical Reporting
  title: Tool Telemetry & Analytical Reporting
  blocks:
  - callout:
      text: The figures below are a historical sample from the original page, including a September 2026
        heartbeat. They are not live counters.
  - facts:
    - key: Tracked tool calls
      value: 5,800+ captured non-blocking
    - key: Distillation byte savings
      value: 54.3%
    - key: Average tool score
      value: 4.82 / 5
    - key: Claude harness failure rate
      value: 3.9%
  - text: |-
      `harnez stats` queries the local SQLite telemetry database populated by `harnez exec` and `harnez rate`. It breaks down call frequency, quality scores, failure rates, and distillation byte savings across tools, agents, and repositories.

      | Tool / Dimension | Sample Calls | Avg Score (1–5) | Failure Rate | Operational Role |
      | --- | --- | --- | --- | --- |
      | `Bash` (via `harnez exec`) | 5,594 | 4.82 | 4.1% | Proxied shell execution with automatic exit scoring |
      | `Edit` / `apply_patch` | 144 | 4.48 | 11.1% | Structured codebase modification & diff application |
      | `Read` / `Write` / `Grep` | 59 | 4.92 | 0.0% | High-reliability read-only and code-writing operations |
      | `heartbeat` (`rate --ok`) | 37 | n/a | 0.0% | Lean liveness assertions (issue 179) |
      | **Agent: Claude Code** | 5,337 | 4.85 | 3.9% | Primary agent session attribution via session ID |
      | **Agent: OpenAI Codex** | 553 | 4.42 | 9.4% | Codex exec interception & telemetry tracking |
      | **Agent: Antigravity (AGY)** | 21 | 5.00 | 0.0% | Native `hooks.json` PreToolUse interception |

      ```
      # render the full analytical report with tool, agent, and project breakdowns
      $ harnez stats

      # filter report to the current session (resolved from environment)
      $ harnez stats --auto

      # inspect feedback token overhead and distillation ratios
      $ harnez stats --overhead --project harnez

      distillation byte savings: 54.33% (27,957 -> 12,769 bytes)
      heartbeat (harnez rate --ok): 37 recorded, last at 2026-09-07T07:19:55Z
      feedback overhead: 28.1 avg bytes/call, ~943 one-time instruction tokens
      ```

      ### Two-Stage Hook Interception & Spill Truncation

      `PreToolUse` hooks rewrite shell commands into `harnez exec -- <cmd>` (via the `⚙` symlink). The wrapper proxies unbuffered stdio, caps non-TTY output via `spec/exec.yaml` (51,200 bytes / 2,000 lines by default, or `--max-output-bytes`) with lazy spill files, enforces Quota-1 single-run `go test` / `gotestsum` budgets, and writes SQLite telemetry asynchronously.

      ### Noise Distillation Engine

      `harnez distill` strips passing test noise, ANSI escapes, and repeated build chatter before output enters the agent's context window, and pairs with spill-file truncation when raw or distilled logs exceed budget.

      ### Native Multi-Agent Hooks & Shims

      Includes dedicated adapters: Claude Code `settings.json` hooks (including `PreCompact` read-marker resets), guarded `bash` PATH shim and `hooks.json` integration for Antigravity, Codex config hooks, and inherited-FD telemetry relay sockets for confined runner processes.
- id: features
  tag: Core Engine Features
  title: Core Engine Features
  blocks:
  - cards:
    - title: Multi-Agent Harness & Subagents
      text: Dispatch and resume sessions across Claude Code, Codex, Antigravity, and Pi (`harnez agent`,
        `harnez models`) using spec-driven role picks (`cheap`/`lean`/`smart`/`best`), effort tiers up to
        `xhigh`/`max`, per-turn cost/tool-call limits, and `--accept-cost` confirmation gates.
    - title: Session Isolation & Safe Promotion
      text: Isolate untrusted runners inside `$TAIA_SESSION_DIR` with inherited-FD broker sockets for
        telemetry, usage, and own-session registry, verified Bubblewrap (`/tmp` tmpfs + UID-owned binds),
        and `O_DIRECTORY|O_NOFOLLOW` + SHA-256 staged host binary promotion (`harnez install --staged`).
    - title: Bounded Execution & Quota-1
      text: '`harnez exec` caps non-TTY output via `spec/exec.yaml` spill files, `harnez distill` trims
        log noise, and Quota-1 tracks plain, targeted, and coverage `go test` or `gotestsum` runs to
        halt redundant test loops until code changes.'
    - title: Local & Forge-Tracked Issues
      text: '`harnez find` searches code, docs, similar tickets, and next IDs; `harnez issues` handles
        create, comment, edit, close, and reopen both in local `issues/` trackers and on Codeberg/GitHub
        forges with strong duplicate gating and private `fj --all` fallback.'
    - title: AGit Repo Scaffolding & Push Guards
      text: '`harnez init` detects repo modes (`solo`, `fork`, `team`), writes `.harnez/repo.yaml`, sets
        repo-local AGit pull tracking (`autoSetupMerge=always`), and enforces `protected_main` on AGit
        remotes via `harnez push-guard` and `pre-push` hooks.'
    - title: Release & Forge Automation
      text: '`harnez release` infers patch/minor bump cadence from tag history (honoring custom `tag_prefix`),
        propagates versions, builds with `GOWORK=off`, signs `SHA256SUMS` non-interactively with minisign,
        and publishes artifacts to Codeberg.'
    - title: Concise Mode & Key Merging
      text: '`harnez mode` switches session terseness across `lite`, `std`, `ultra`, and `vision` in
        `.harnez/rules/Local.md`, while `harnez apply` cleanly merges managed JSON keys, shell PATH/completions
        via `goself`, and commented Markdown blocks.'
    - title: Copyable Language & Practice Docs
      text: Bundles maintained docs (full and `.lite` variants) for Go, Bash, Make, Rust, Zig, C++,
        GTK4, Markdown, AGit, GoRelease, Canary-first probes, Spec schemas, Website rules, and Agentic Loops.
- id: commands
  tag: Commands Reference
  title: Commands Reference
  blocks:
  - text: |-
      Self-contained Go CLI built from `spec/*.yaml` single-source definitions and managed via `goself`.

      | Command | Key flags / verbs | What it does |
      | --- | --- | --- |
      | `agent` | `start` `resume` `wait` `list` `commands` | Launch, inspect, compact, rate, and extract command logs across Claude, Codex, AGY, and Pi |
      | `apply` | `-c` `-t` `-d` `--profiles` `--prune` `-s` | Sync global Claude, Gemini, Codex, and Pi configs, shell setup, skills, and docs idempotently |
      | `usage` | `-w` `--table` `--compact` `--host` `--mic` `--json` | Show or watch unified multi-provider token quotas, CPU/RAM/GPU load, and live mic levels |
      | `stats` | `--auto` `--agents` `--overhead` `--project` `--json` | Report tool call frequency, average rating, failure rate, cost, and distillation savings |
      | `exec` (`⚙`) | `--max-output-bytes` `--quota-1` `--distill` `--timeout` | Run commands with spill-file output caps, Quota-1 test gating, noise filtering, and telemetry |
      | `distill` | `--` `hook` | Strip passing test chatter, ANSI escapes, and redundant output lines to conserve tokens |
      | `find` | `issues` `code` `docs` `similar` `next` `--json` | Search local or forge issues, code, docs, duplicate candidates, and session history |
      | `issues` | `new` `show` `comment` `edit` `start` `close` `--forge` | Manage local Markdown or Forgejo/GitHub issues with duplicate gating and index commits |
      | `forge` | `token create|rotate|revoke|show` `--write` | Manage separate Codeberg/Forgejo read and write API tokens safely on the host |
      | `pr` | `wait <number> --contains <sha>` | Wait for Codeberg (Forgejo) or GitHub pull requests to merge or close |
      | `init` | `-d` `--docs` `-m` `--protected-main` `--quota-1` `--ramp` | Scaffold `.harnez/repo.yaml`, `AGENTS.md`, Makefile targets, language docs, and AGit config |
      | `install` | `--staged` `--sha256` `--direct` `--dry-run` | Deploy binary/completions/`⚙`/man pages via `goself`, promote staged builds, or install deps |
      | `server` | `install` `status` `logs` `restart` `stop` | Manage the local `harnez-agent-collector` systemd service and broker daemon |
      | `mode` | `lite` `std` `ultra` `vision` `off` `-e` | Switch ConciseMode terseness level in `.harnez/rules/Local.md` or emit an ephemeral directive |
      | `read` | `-L` `-I` `--compress` `--line-numbers` | Bounded source reading, safe Go/JSON lexical compression, and terminal/vision card rendering |
      | `lint` | `--check` `--lang` `--json` `-v` | Validate Go, Bash, Makefile, and Markdown files against repository rules |
      | `release` | `-b` `--tag-prefix` `--skip-build` `--continue` `-n` | Infer semver bump, build (`GOWORK=off`), sign with minisign, tag, and publish to Codeberg |
      | `push-guard` | `<remote-ref>` `--remote` `--url` | Enforce `protected_main` push policy on AGit remotes while keeping GitHub mirrors working |
      | `diff` | `-c` `-t` `-e` `--components` `--prune` | Preview pending changes without writing (`-e` exits 1 on drift) |
      | `status` | `-c` `-t` `--components` `--debloat` | Print configuration summary, hook trust, and verify applied target state |
      | `models` | `--picks` `--json` | Inspect registered models, capabilities, FrontierCode 2.0 relative costs, and role picks |
      | `rate` | `1-5` `--ok` | Record a 1–5 internal tool quality rating or a lean liveness heartbeat into SQLite |
      | `revert` | `-c` `-t` `--managed` | Remove managed keys from `settings.json` and strip managed Markdown blocks |
- id: architecture
  tag: Architecture
  title: How it works
  blocks:
  - text: |-
      ### 1. Two-Stage Hook Interception

      PreToolUse lifecycle hooks rewrite tool invocations (such as `Bash` or `run_command`) into `⚙` (`harnez exec`) wrappers. The hook returns immediately while `harnez exec` proxies unbuffered stdio, enforces `spec/exec.yaml` spill caps and Quota-1 `go test` budgets, and relays SQLite telemetry asynchronously.

      ### 2. Key Merge, Not Replace

      `harnez apply` only mutates keys it explicitly manages (`model`, `effortLevel`, `permissions`, `hooks`, `env`, `spinnerVerbs`, `statusLine`). Existing user preferences, themes, and auth credentials in target configs are preserved.

      ### 3. Managed Markdown Boundaries

      Content in `AGENTS.md` and `CLAUDE.md` stays inside HTML comment markers (`<!-- harnez:begin ... -->`), while generated harness rules live separately in `.harnez/rules/`. Project notes outside those markers remain untouched.

      ### 4. Brokered Isolation & Shared Locking

      On the host, quota cache reads and writes coordinate via file locks, and the `harnez server` collector serves usage/telemetry continuously. Confined runner processes access telemetry, usage snapshots, and own-session registry over an inherited `socketpair` FD (`SCM_RIGHTS`) with Landlock, verified Bubblewrap binds, and host-only binary promotion via `O_NOFOLLOW`.
- id: config
  tag: Configuration
  title: config.yaml at a glance
  blocks:
  - text: |-
      ```
      target_dir: ~/.claude
      skills_target: ~/.gemini/skills
      codex_skills_target: ~/.codex/skills
      pi_agent_target: ~/.pi/agent

      global_section_targets:
        - ~/.claude/CLAUDE.md
        - ~/.codex/AGENTS.md
        - ~/.gemini/GEMINI.md

      docs_profiles:
        go: [golang, bash, make, spec, canary]
        codeberg: [agit, gorelease]

      effort: medium

      permissions:
        allow:
          - "Bash(git *)"
          - "Bash(make *)"
          - "Read(~/projects/**)"

      hooks:
        - event: PreToolUse
          matcher: Bash
          command: "harnez exec hook"
        - event: Stop
          command: "harnez hook sound"

      skills:
        - name: lean-sprint
          description: "Run one ticket or scoped task as a lean sprint"
          file: docs/commands/lean-sprint.md
      ```
